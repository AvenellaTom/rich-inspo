function closePostModal(){$('postModal').classList.remove('show');renderCalendarView();}

function savePost(postId){
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  const p = (c.posts||[]).find(x=>x.id===postId); if(!p) return;
  
  p.topic = $('peTopic').value.trim();
  p.date = $('peDate').value;
  p.status = $('peStatus').value;
  p.clickupLink = $('peClickup').value.trim();
  p.platforms = [...document.querySelectorAll('input[name="plat"]:checked')].map(x=>x.value);
  p.creativeType = $('peType').value;
  p.dimensions = $('peDim').value;
  p.brief = $('peBrief').value;
  p.captionEN = $('peCaptionEN').value;
  p.captionAR = $('peCaptionAR').value;
  p.visualCopyEN = $('peVisEN').value;
  p.visualCopyAR = $('peVisAR').value;
  p.creativeDirection = $('peDirection').value;
  
  // Gather assets
  p.assets = [];
  document.querySelectorAll('[data-au]').forEach(inp=>{
    const i = parseInt(inp.dataset.au);
    const labelInp = document.querySelector(`[data-ai="${i}"]`);
    const url = inp.value.trim();
    if(url) p.assets.push({label:labelInp?labelInp.value.trim():'', url});
  });
  
  // Gather script rows
  p.videoScript = [];
  const stInputs = document.querySelectorAll('[data-st]');
  const byRow = {};
  stInputs.forEach(inp=>{
    const ri = inp.dataset.st;
    if(!byRow[ri]) byRow[ri] = {};
    byRow[ri][inp.dataset.sf] = inp.value;
  });
  Object.keys(byRow).sort((a,b)=>a-b).forEach(k=>{
    const r = byRow[k];
    if(r.timecode||r.voiceEN||r.voiceAR||r.visuals) p.videoScript.push(r);
  });
  
  saveCalendars();
  closePostModal();
}

function deletePost(postId){
  if(!confirm('Delete this post?')) return;
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  c.posts = (c.posts||[]).filter(x=>x.id!==postId);
  saveCalendars();
  closePostModal();
}

function addAssetRow(){
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  // Save current first
  const postId = $('postModalBody').querySelector('[data-au]') ? 
    null : null; // We'll just re-render
  const list = $('assetsList');
  const idx = list.children.length;
  const row = document.createElement('div');
  row.className = 'asset-row';
  row.innerHTML = `<input class="asset-label" placeholder="Label" data-ai="${idx}"><input placeholder="https://company.sharepoint.com/..." data-au="${idx}"><button class="btn sm danger" onclick="this.parentElement.remove()">&times;</button>`;
  list.appendChild(row);
}

function removeAsset(i){
  document.querySelector(`.asset-row:has([data-au="${i}"])`).remove();
}

function addScriptRow(){
  const area = $('scriptArea');
  let table = area.querySelector('.script-table');
  if(!table){
    area.innerHTML = `<table class="script-table"><thead><tr><th>Timecode</th><th>Voice over (EN)</th><th>Voice over (AR)</th><th>Visual suggestions</th><th></th></tr></thead><tbody></tbody></table><button class="btn sm" onclick="addScriptRow()" style="margin-top:6px">+ Add line</button>`;
    table = area.querySelector('.script-table');
  }
  const tbody = table.querySelector('tbody');
  const idx = tbody.children.length;
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input data-st="${idx}" data-sf="timecode" placeholder="0:00-0:00"></td><td><input data-st="${idx}" data-sf="voiceEN"></td><td><input data-st="${idx}" data-sf="voiceAR"></td><td><input data-st="${idx}" data-sf="visuals"></td><td><button class="btn sm danger" onclick="this.closest('tr').remove()">&times;</button></td>`;
  tbody.appendChild(tr);
}

function removeScriptRow(i){
  const rows = $('scriptArea').querySelectorAll('tbody tr');
  if(rows[i]) rows[i].remove();
}

function addComment(section){
  const nameEl = $('cmName'+section.replace('caption','').replace('creative','Cr'));
  const textEl = $('cmText'+section.replace('caption','').replace('creative','Cr'));
  const intEl = $('cmInt'+section.replace('caption','').replace('creative','Cr'));
  
  // Map section IDs
  let nameId,textId,intId;
  if(section==='captionEN'){nameId='cmNameEN';textId='cmTextEN';intId='cmIntEN';}
  else if(section==='captionAR'){nameId='cmNameAR';textId='cmTextAR';intId='cmIntAR';}
  else{nameId='cmNameCr';textId='cmTextCr';intId='cmIntCr';}
  
  const name = $(nameId).value.trim();
  const text = $(textId).value.trim();
  const internal = $(intId).checked;
  if(!text) return;
  
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  // Find current post from modal
  const postId = $('postModalFoot').innerHTML.match(/deletePost\('([^']+)'\)/);
  if(!postId) return;
  const p = (c.posts||[]).find(x=>x.id===postId[1]); if(!p) return;
  p.comments = p.comments||[];
  p.comments.push({section, by:name||'Anonymous', text, internal, editor:true, d:new Date().toISOString()});
  saveCalendars();
  editPost(p.id);
}


function editComment(idx){
  const postMatch = $('postModalFoot').innerHTML.match(/deletePost\('([^']+)'\)/);
  if(!postMatch) return;
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  const p = (c.posts||[]).find(x=>x.id===postMatch[1]); if(!p) return;
  const cm = (p.comments||[])[idx]; if(!cm) return;
  const newText = prompt('Edit comment:', cm.text);
  if(newText===null) return;
  if(newText.trim()===''){
    p.comments.splice(idx,1);
  } else {
    cm.text = newText.trim();
    cm.edited = new Date().toISOString();
  }
  saveCalendars();
  editPost(p.id);
}

function deleteComment(idx){
  if(!confirm('Delete this comment?')) return;
  const postMatch = $('postModalFoot').innerHTML.match(/deletePost\('([^']+)'\)/);
  if(!postMatch) return;
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  const p = (c.posts||[]).find(x=>x.id===postMatch[1]); if(!p) return;
  (p.comments||[]).splice(idx,1);
  saveCalendars();
  editPost(p.id);
}

/* ========== FILE UPLOAD (Creative previews) ========== */
function uploadCreative(lang){
  if(editorLocked) return;
  $('file'+lang).click();
}

function handleUpload(lang){
  const files = Array.from($('file'+lang).files);
  if(!files.length) return;
  files.forEach(f=>processFile(f,lang));
  $('file'+lang).value = '';
}

function removeSlide(lang,idx){
  const postMatch = $('postModalFoot').innerHTML.match(/deletePost\('([^']+)'\)/);
  if(!postMatch) return;
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  const p = (c.posts||[]).find(x=>x.id===postMatch[1]); if(!p) return;
  const key = 'carousel'+lang;
  if(!p[key]) return;
  p[key].splice(idx,1);
  saveCalendars();
  editPost(p.id);
}

let uploadQueue = Promise.resolve();

function processFile(file, lang){
  const isVideo = file.type.startsWith('video/');
  const maxSize = isVideo ? 20*1024*1024 : 8*1024*1024;
  if(file.size > maxSize){
    alert(isVideo ? 'Video too large. Keep under 20MB.' : 'Image too large. Keep under 8MB.');
    return;
  }
  const postMatch = $('postModalFoot').innerHTML.match(/deletePost\('([^']+)'\)/);
  if(!postMatch) return;
  const postId = postMatch[1];
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  const p = (c.posts||[]).find(x=>x.id===postId); if(!p) return;
  const mime = file.type || (isVideo ? 'video/mp4' : 'image/jpeg');
  const key = 'carousel'+lang;

  // Queue uploads sequentially so slide indices are correct
  uploadQueue = uploadQueue.then(async ()=>{
    if(!p[key]) p[key] = [];
    const slideIdx = p[key].length;

    // Show uploading indicator
    const grid = $('grid'+lang);
    if(grid){
      const placeholder = document.createElement('div');
      placeholder.className = 'creative-thumb';
      placeholder.style.cssText = 'display:flex;align-items:center;justify-content:center;background:var(--bg);border-color:var(--blue)';
      placeholder.innerHTML = '<div style="font-size:10px;color:var(--blue);text-align:center">Uploading...</div>';
      const addBtn = grid.querySelector('.creative-add-btn');
      if(addBtn) grid.insertBefore(placeholder, addBtn);
      else grid.appendChild(placeholder);
    }

    try {
      // Upload the slide
      const uploadUrl = '/api/creative-upload?calId='+encodeURIComponent(currentCalId)+'&postId='+encodeURIComponent(postId)+'&lang='+encodeURIComponent(lang+'-'+slideIdx)+'&mime='+encodeURIComponent(mime);
      const r = await fetch(uploadUrl, {method:'POST', body:file, headers:{'content-type':mime}});
      const d = await r.json();

      if(d.ok){
        p[key].push({type:isVideo?'video':'image', idx:slideIdx});

        // Also upload as base lang key for first slide (backward compat)
        if(slideIdx===0){
          fetch('/api/creative-upload?calId='+encodeURIComponent(currentCalId)+'&postId='+encodeURIComponent(postId)+'&lang='+encodeURIComponent(lang)+'&mime='+encodeURIComponent(mime),{method:'POST',body:file,headers:{'content-type':mime}}).catch(()=>{});
          if(lang==='EN'){p.hasCreativeEN=true;p.creativeENType=isVideo?'video':'image';}
          else{p.hasCreativeAR=true;p.creativeARType=isVideo?'video':'image';}
        }
        p.creativesEN='';p.creativesAR='';
        await saveCalendars();
        editPost(p.id);
      }
    } catch(e){
      console.error('Upload failed:', e);
      editPost(p.id);
    }
  });
}

async function sendReply(postId, commentIdx){

const carouselState = {};
function carouselNav(id,dir){
  const track = document.getElementById(id); if(!track) return;
  const total = track.children.length;
  carouselState[id] = ((carouselState[id]||0)+dir+total)%total;
  carouselGo(id, carouselState[id]);
}
function carouselGo(id,idx){
  const track = document.getElementById(id); if(!track) return;
  carouselState[id] = idx;
  track.style.transform = `translateX(-${idx*100}%)`;
  const dots = document.getElementById(id+'-dots');
  if(dots) dots.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
}

async function clientEnter(){
  const pin = document.getElementById('clientPinInput').value.trim();
  const err = document.getElementById('clientError');
  err.textContent = '';
  
  const data = await loadCalendarClient(clientCalId_c, pin);
  if(data.error==='pin'){err.textContent='Incorrect PIN. Please try again.';return;}
  if(data.error){err.textContent='Calendar not found.';return;}
  
  clientPin = pin;
  clientData = data;
  renderClientView();
}

function renderClientView(targetMonth){
  const c = clientData;
  const posts = (c.posts||[]).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  
  // Determine month
  const allDates = posts.map(p=>p.date).filter(Boolean).sort();
  let vm;
  if(targetMonth) vm = targetMonth;
  else if(allDates.length){
    const now = new Date();
    const nowKey = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    const hasNow = allDates.some(d=>d.startsWith(nowKey));
    vm = hasNow ? new Date(now.getFullYear(),now.getMonth(),1) : new Date(allDates[0]+'T00:00:00');
  } else { vm = new Date(); }
  
  const year = vm.getFullYear(), month = vm.getMonth();
  const monthKey = year+'-'+String(month+1).padStart(2,'0');
  let monthPosts = posts.filter(p=>(p.date||'').startsWith(monthKey));
  if(clientStatusFilter!=='all'){
    monthPosts = monthPosts.filter(p=>{
      const fb = p.feedback||{};
      if(clientStatusFilter==='approved') return fb.status==='approved';
      if(clientStatusFilter==='declined') return fb.status==='declined';
      if(clientStatusFilter==='pending') return !fb.status || fb.status==='';
      return true;
    });
  }
  clientCurrentMonth = vm;
  
  // Nav months
  const availMonths = [...new Set(allDates.map(d=>d.substring(0,7)))].sort();

  // Stats
  const totalPosts = monthPosts.length;

    <div class="client-wrap">`;
  
  if(c.intro) html += `<div class="client-intro"><p>${esc(c.intro)}</p></div>`;
  
  // Prominent toolbar
  html += `<div class="client-toolbar">
    <div class="ct-left">
      <div class="client-month-nav" style="margin-bottom:0">
        ${prevMonth ? `<button class="month-nav" onclick="clientGoMonth('${prevMonth}')">&lsaquo;</button>` : '<div style="width:36px"></div>'}
        <h2 style="min-width:auto;font-size:22px">${MONTH_NAMES[month]} ${year}</h2>
        ${nextMonth ? `<button class="month-nav" onclick="clientGoMonth('${nextMonth}')">&rsaquo;</button>` : '<div style="width:36px"></div>'}
      </div>
      <div class="client-view-toggle">
        <button class="${clientTab==='calendar'?'active':''}" onclick="setClientTab('calendar')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/></svg> Calendar</button>

            <div class="cc-approval-status"><span class="status-icon" style="background:${statusIcon[p.status]||'#9ca3af'}"></span>${esc(p.status||'Draft')}</div>
            <button class="btn sm cc-approve ${fb.status==='approved'?'active':''}" onclick="clientFeedback('${p.id}','approved')">Approve</button>
            <button class="btn sm cc-changes ${fb.status==='declined'?'active':''}" onclick="clientFeedback('${p.id}','declined')">Request changes</button>
          </div>
          <div class="cc-comments" style="padding:0 20px 16px">
            <div class="cc-comment-box">
              ${commentsHTML||'<div class="cc-no-comments">No comments yet.</div>'}
              <div class="cc-new-comment">
                <div class="cc-name-row"><label>Your name</label><input id="cn-${p.id}" value="${esc(savedName)}" placeholder="Enter your name" onchange="saveClientName(this.value)"></div>
                <div class="cc-msg-row"><textarea id="ct-${p.id}" placeholder="Leave a comment or request changes..." rows="2"></textarea><button class="btn sm primary" onclick="clientComment('${p.id}')">Send</button></div>
              </div>
            </div>
          </div>
        </div>`;
      });
      html += '</div>'; // close grid
    }
  }
  
  html += `<div class="client-footer"><img src="${$('logoImg').src}" alt="RICH">Prepared by RICH Marketing</div>`;
  html += '</div>';
  $('clientApp').innerHTML = html;
  
  // Init sizer
  try{clientViewSize=localStorage.getItem('rich_cal_sz')||'l';}catch(e){}
  document.querySelectorAll('#clientSizer button').forEach(b=>{b.classList.toggle('on',b.dataset.sz===clientViewSize);});
  const cg=document.getElementById('clientGrid');if(cg)cg.className='client-grid sz-'+clientViewSize;
}

function clientGoMonth(key){
  const [y,m] = key.split('-').map(Number);
  renderClientView(new Date(y,m-1,1));
}

function getWeekOfMonth(d){
  const first = new Date(d.getFullYear(),d.getMonth(),1);
  return Math.ceil((d.getDate()+((first.getDay()+6)%7))/7);
}

function getWeekStart(d){
  const day = (d.getDay()+6)%7;
  const start = new Date(d);
  start.setDate(start.getDate()-day);
  return start;
}

async function clientFeedback(postId, status){
  const p = (clientData.posts||[]).find(x=>x.id===postId); if(!p) return;
  p.feedback = p.feedback||{status:'',comments:[]};
  p.feedback.status = (p.feedback.status===status) ? '' : status;
  renderClientView(clientCurrentMonth);
  await sendFeedback(clientCalId_c, clientPin, postId, {status:p.feedback.status});
}



async function editClientCaption(postId, field){
  const p = (clientData.posts||[]).find(x=>x.id===postId); if(!p) return;
  const current = p[field]||'';
  
  // Replace the paragraph with a textarea inline
  const elId = field==='captionEN'?'cap-'+postId+'-en':field==='captionAR'?'cap-'+postId+'-ar':'cap-'+postId+'-c';
  const el = document.getElementById(elId);
  if(!el) return;
  
  // If already editing, skip
  if(el.tagName==='TEXTAREA') return;
  
  const ta = document.createElement('textarea');
  ta.value = current;
  ta.id = elId;
  ta.style.cssText = 'width:100%;min-height:100px;padding:8px 10px;border:1px solid var(--blue);border-radius:6px;font-size:14px;font-family:inherit;line-height:1.5;resize:vertical;';
  if(field==='captionAR') ta.dir = 'rtl';
  el.replaceWith(ta);
  ta.focus();
  
  // Add save/cancel below
  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex;gap:6px;margin-top:6px;';
  actions.innerHTML = `<button class="btn sm primary" id="save-${postId}-${field}">Save</button><button class="btn sm" id="cancel-${postId}-${field}">Cancel</button>`;
  ta.after(actions);
  
  document.getElementById('save-'+postId+'-'+field).onclick = async function(){
    const newVal = ta.value;
    p[field] = newVal;
    try{
      await fetch('/api/calendar-edit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:clientCalId_c,pin:clientPin,postId,captionEN:field==='captionEN'?newVal:undefined,captionAR:field==='captionAR'?newVal:undefined,caption:field==='caption'?newVal:undefined})});
    }catch(e){console.error(e);}
    renderClientView(clientCurrentMonth);
  };
  document.getElementById('cancel-'+postId+'-'+field).onclick = function(){
    renderClientView(clientCurrentMonth);
  };
}


async function deleteClientComment(postId, commentIdx){
  if(!confirm('Delete this comment?')) return;
  const p = (clientData.posts||[]).find(x=>x.id===postId); if(!p) return;
  const fb = p.feedback||{};
  const comments = fb.comments||[];
  const topLevel = comments.filter(cm=>!cm.replyTo);
  const cm = topLevel[commentIdx]; if(!cm) return;
  const realIdx = comments.indexOf(cm);
  // Remove the comment and its replies
  const newComments = comments.filter((c,i)=>i!==realIdx && c.replyTo!==commentIdx);
  fb.comments = newComments;
  renderClientView(clientCurrentMonth);
  await sendFeedback(clientCalId_c, clientPin, postId, {replaceComments:newComments});
}

async function editClientComment(postId, commentIdx){
  const p = (clientData.posts||[]).find(x=>x.id===postId); if(!p) return;
  const fb = p.feedback||{};
  const comments = fb.comments||[];
  const topLevel = comments.filter(cm=>!cm.replyTo);
  const cm = topLevel[commentIdx]; if(!cm) return;
  const newText = prompt('Edit your comment:', cm.t);
  if(newText===null) return;
  if(newText.trim()===''){
    const realIdx = comments.indexOf(cm);
    if(realIdx>-1) comments.splice(realIdx,1);
  } else {
    cm.t = newText.trim();
  }
  renderClientView(clientCurrentMonth);
  await sendFeedback(clientCalId_c, clientPin, postId, {replaceComments:comments});
}

async function clientComment(postId){
  const nameInp = document.getElementById('cn-'+postId);
  const textInp = document.getElementById('ct-'+postId);
  const name = nameInp?.value?.trim()||'Client';
  const text = textInp?.value?.trim(); if(!text) return;
  saveClientName(name);
  const p = (clientData.posts||[]).find(x=>x.id===postId); if(!p) return;
  p.feedback = p.feedback||{status:'',comments:[]};
  p.feedback.comments.push({t:text, by:name, d:new Date().toISOString()});
  renderClientView(clientCurrentMonth);
  await sendFeedback(clientCalId_c, clientPin, postId, {comment:text, by:name});
}

/* ========== BOOT ========== */
init();
</script>
