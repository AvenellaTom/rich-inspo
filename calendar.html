<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f7;--card:#fff;--text:#1a1a1a;--muted:#666;--muted-2:#999;--border:#e5e5e7;--border-2:#d1d1d6;--blue:#4f46e5;--blue-light:#eef2ff;--green:#16a34a;--amber:#f59e0b;--coral:#ef4444;--purple:#7c3aed;--teal:#0891b2;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em}

/* Header */
.header{background:#000;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.header img{height:48px}
.header h1{font-size:22px;font-weight:600;flex:1}
.header-actions{display:flex;gap:8px}

/* Buttons */
.btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:8px 16px;border-radius:6px;border:1px solid var(--border-2);background:var(--card);color:var(--text);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:#4338ca}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border:none;background:none}
.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.danger{color:var(--coral);border-color:var(--coral)}
.btn.danger:hover{background:#fef2f2}

/* Layout */
.container{max-width:1280px;margin:0 auto;padding:24px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}

/* Year View */
.year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.year-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.year-grid{grid-template-columns:1fr}}
.month-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.month-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.month-card h3{font-size:16px;margin-bottom:8px;font-weight:600}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center}
.mini-grid .day{padding:3px 0;border-radius:3px;color:var(--muted)}
.mini-grid .day.has-post{background:var(--blue);color:#fff;font-weight:600}
.mini-grid .day.today{outline:2px solid var(--amber);outline-offset:-1px}
.post-count{font-size:12px;color:var(--blue);font-weight:600;margin-top:8px}

/* Month View */
.month-header{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:4px}
.month-header h2{font-size:28px;min-width:220px;text-align:center}
.month-nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--border-2);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.month-nav:hover{border-color:var(--blue);color:var(--blue)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;margin-top:12px}
.cal-head{background:var(--card);padding:10px 4px;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.cal-day{background:var(--card);min-height:120px;padding:6px;position:relative;vertical-align:top}
.cal-day.empty{background:var(--bg);opacity:.5}
.cal-day .dn{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.cal-day .dn.today{color:var(--blue);font-weight:700}
.cal-day .add-btn{font-size:11px;color:var(--blue);cursor:pointer;padding:2px 0;display:none}
.cal-day:hover .add-btn{display:block}
.day-post{background:var(--bg);border-radius:4px;padding:4px 6px;margin-bottom:3px;font-size:11px;cursor:pointer;border-left:3px solid var(--green);transition:background .15s}
.day-post:hover{background:var(--blue-light)}
.day-post .dp-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-post .dp-platforms{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap}
.dp-platforms .ptag{font-size:9px;padding:1px 4px;border-radius:3px;color:#fff;font-weight:600}
.ptag.facebook{background:#1877f2}
.ptag.instagram{background:#e4405f}
.ptag.linkedin{background:#0a66c2}
.ptag.x{background:#000}
.ptag.tiktok{background:#010101}
.ptag.youtube{background:#ff0000}
.ptag.email{background:#6b7280}
.ptag.blog{background:#059669}
.ptag.other{background:#8b5cf6}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.status-dot.draft{background:#d1d5db}.status-dot.review{background:var(--amber)}.status-dot.approved{background:var(--green)}.status-dot.scheduled{background:var(--blue)}.status-dot.published{background:var(--green)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}
.modal-overlay.show{display:flex;justify-content:center;align-items:flex-start}
.modal{background:var(--card);border-radius:12px;width:100%;max-width:900px;margin:20px auto;box-shadow:0 20px 60px rgba(0,0,0,.2);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head h2{font-size:18px}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);padding:4px 8px}
.modal-body{padding:20px;overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

/* Form fields */
.field{margin-bottom:16px}

/* Ensure form fields are interactive */
.modal-body input,.modal-body textarea,.modal-body select{-webkit-user-select:auto;user-select:auto;pointer-events:auto;touch-action:auto}
.modal-body textarea{cursor:text}
.field label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:8px 10px;border:1px solid var(--border-2);border-radius:6px;background:var(--card);color:var(--text);transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.field textarea{resize:vertical;min-height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:600px){.field-row-3{grid-template-columns:1fr}}

/* Checkboxes */
.check-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.check-row label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);cursor:pointer}
.check-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--blue)}

/* Preview panel */
.phone-preview{background:#111;border-radius:16px;width:180px;min-width:180px;max-height:280px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.phone-preview img{width:100%;height:100%;object-fit:cover}
.phone-preview .no-preview{color:#555;font-size:12px;text-align:center;padding:12px}
.phone-preview video{width:100%;height:100%;object-fit:cover}

/* Editor layout */
.editor-layout{display:flex;gap:20px}
.editor-fields{flex:1;min-width:0}
.preview-wrap{align-self:flex-start}
@media(max-width:700px){.editor-layout{flex-direction:column}.phone-preview{width:100%;max-height:200px;border-radius:12px}.preview-wrap{position:static}}

/* Section dividers */
.section-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text);padding:12px 0 8px;border-bottom:2px solid var(--text);margin:20px 0 12px}

/* Comments */
.comments-area{background:var(--bg);border-radius:8px;padding:12px;margin-top:8px}
.comment-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.comment-item:last-child{border-bottom:none}
.comment-meta{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.comment-meta .badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;text-transform:uppercase}
.badge.editor{background:#dbeafe;color:#1d4ed8}
.badge.internal{background:#fef3c7;color:#92400e}
.comment-add{display:flex;gap:6px;margin-top:8px}
.comment-add input{flex:1;font-size:13px;padding:6px 8px;border:1px solid var(--border-2);border-radius:6px}
.comment-add .int-toggle{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap}

/* Assets */
.asset-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:6px 8px;background:var(--bg);border-radius:6px}
.asset-row input{flex:1}
.asset-row .asset-label{width:120px;flex-shrink:0}
.asset-row a{color:var(--blue);font-size:12px;white-space:nowrap}

/* Creative uploads */
.creative-slot{border:2px dashed var(--border-2);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:border-color .15s;margin-bottom:12px;position:relative}
.creative-slot:hover{border-color:var(--blue)}
.creative-slot.has-file{border-style:solid;border-color:var(--green)}
.creative-slot img{max-width:100%;max-height:200px;border-radius:6px}
.creative-slot .upload-text{color:var(--muted);font-size:13px}

/* Video script */
.script-table{width:100%;border-collapse:collapse;font-size:13px}
.script-table th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--border)}
.script-table td{padding:4px 6px;border-bottom:1px solid var(--border)}
.script-table input,.script-table textarea{width:100%;border:none;background:transparent;font-size:13px;font-family:inherit;padding:4px;resize:vertical}
.script-table input:focus,.script-table textarea:focus{outline:none;background:var(--blue-light);border-radius:4px}


/* ========== CLIENT VIEW (polished) ========== */
.client-wrap{max-width:900px;margin:0 auto;padding:24px 16px}
.client-intro{background:var(--card);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px;box-shadow:var(--shadow)}
.client-intro p{font-size:14px;color:var(--muted);line-height:1.6}
.client-month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:24px}
.client-month-nav h2{font-size:28px;min-width:220px;text-align:center}
.client-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:28px}
.client-stat{background:var(--card);border-radius:8px;padding:14px 16px;text-align:center;box-shadow:var(--shadow)}
.client-stat .stat-num{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:var(--blue)}
.client-stat .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:2px}
.sz-s .client-week-label,.sz-m .client-week-label,.sz-l .client-week-label{display:none}
.client-week-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}

.client-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;border:1px solid var(--border)}
.client-card .cc-media{width:100%;background:#0a0a0a;position:relative;display:flex;align-items:center;justify-content:center}
.client-card .cc-media img{width:100%;display:block;object-fit:contain;max-height:400px}
.client-card .cc-media video{width:100%;display:block;max-height:400px}
.client-card .cc-media img{width:100%;display:block}
.client-card .cc-media video{width:100%;display:block}
.client-card .cc-media .no-creative{padding:40px;color:#555;font-size:14px;text-align:center}
.client-card .cc-meta{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.cc-meta .cc-date-block{display:flex;align-items:center;gap:10px}
.cc-meta .cc-day{background:var(--blue);color:#fff;width:44px;height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cc-meta .cc-day .cc-d{font-size:20px;font-weight:700;font-family:'Barlow Condensed',sans-serif}
.cc-meta .cc-day .cc-m{font-size:9px;text-transform:uppercase;font-weight:600;letter-spacing:.04em}
.cc-meta .cc-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600;text-transform:uppercase}
.cc-meta .cc-platforms{display:flex;gap:4px;flex-wrap:wrap}
.cc-meta .cc-platforms .ptag{font-size:11px;padding:4px 10px;border-radius:5px;font-weight:600}
.client-card .cc-content{padding:20px}
.cc-content .cc-section{margin-bottom:16px}
.cc-content .cc-section:last-child{margin-bottom:0}
.cc-content .cc-section h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cc-content .cc-section h4 .platform-icon{width:14px;height:14px;border-radius:3px;display:inline-block}
.cc-content .cc-section p{font-size:14px;line-height:1.6;white-space:pre-wrap}
.cc-content .cc-assets{display:flex;gap:6px;flex-wrap:wrap}
.cc-content .cc-assets a{font-size:13px;padding:6px 12px;background:var(--bg);border-radius:6px;color:var(--blue);text-decoration:none;font-weight:500;transition:background .15s}
.cc-content .cc-assets a:hover{background:var(--blue-light)}
.client-card .cc-approval{padding:16px 20px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cc-approval .cc-status-pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-right:auto}
.cc-approval .btn{min-width:100px;justify-content:center}
.btn.cc-approve{border:2px solid var(--green);color:var(--green);background:transparent;font-weight:600}
.btn.cc-approve:hover,.btn.cc-approve.active{background:var(--green);color:#fff}
.btn.cc-changes{border:2px solid var(--amber);color:var(--amber);background:transparent;font-weight:600}
.btn.cc-changes:hover,.btn.cc-changes.active{background:var(--amber);color:#fff}
.cc-comments{padding:0 20px 16px}
.cc-comments .cc-comment{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.cc-comments .cc-comment:last-of-type{border-bottom:none}
.cc-comments .cc-cm-meta{font-size:11px;color:var(--muted);margin-bottom:2px}
.cc-comments .cc-cm-meta strong{color:var(--text)}
.cc-comment-form{display:flex;gap:6px;padding-top:8px}
.cc-comment-form input{flex:1;padding:8px 12px;border:1px solid var(--border-2);border-radius:6px;font-size:13px;font-family:'Inter',sans-serif}
.cc-comment-form input:focus{outline:none;border-color:var(--blue)}
.cc-comment-form .btn{white-space:nowrap}

/* Footer branding */
.client-footer{text-align:center;padding:40px 20px 24px;font-size:12px;color:var(--muted-2)}
.client-footer img{height:24px;opacity:.4;margin-bottom:6px;display:block;margin-left:auto;margin-right:auto}


/* View sizer (matches library) */
.sizer{display:flex;border:1px solid var(--border-2);border-radius:8px;overflow:hidden}
.sizer button{background:var(--card);border:none;color:var(--muted);padding:8px 10px;cursor:pointer;transition:all .15s}
.sizer button.on{background:var(--blue);color:#fff}
.sizer button svg{display:block}

/* Client card sizes */
.client-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.client-grid.sz-s{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.client-grid.sz-m{grid-template-columns:repeat(2,1fr)}
.client-grid.sz-l{grid-template-columns:repeat(3,1fr);gap:16px}

/* Small card overrides */
.sz-s .client-card .cc-media img,.sz-s .client-card .cc-media video{max-height:200px;object-fit:contain}
.sz-s .client-card .cc-meta{padding:10px 12px}
.sz-s .client-card .cc-meta .cc-day{width:36px;height:36px}
.sz-s .client-card .cc-meta .cc-day .cc-d{font-size:16px}
.sz-s .client-card .cc-title{font-size:14px}
.sz-s .client-card .cc-content{padding:10px 12px}
.sz-s .client-card .cc-content .cc-section p{font-size:12px;max-height:60px;overflow:hidden}
.sz-s .client-card .cc-approval{padding:10px 12px}
.sz-s .client-card .cc-comments{padding:0 12px 10px}
.sz-s .client-card .cc-comments .cc-comment{font-size:12px}

/* Medium card overrides */
.sz-m .client-card .cc-media img,.sz-m .client-card .cc-media video{max-height:300px;object-fit:contain}

/* Admin dashboard */
.admin-dash{margin-bottom:32px}
.admin-dash h2{font-size:24px;margin-bottom:4px}
.admin-dash .dash-sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.cal-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cal-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
.cal-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.cal-card-header{padding:16px 20px;border-bottom:1px solid var(--border)}
.cal-card-header h3{font-size:18px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;margin-bottom:2px}
.cal-card-header .cal-pin{font-size:12px;color:var(--muted)}
.cal-card-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--border)}
.cal-card-stats .ccs{text-align:center;padding:12px 8px;border-right:1px solid var(--border)}
.cal-card-stats .ccs:last-child{border-right:none}
.cal-card-stats .ccs-n{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--blue)}
.cal-card-stats .ccs-l{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.cal-card-actions{padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap}
.cal-card-actions .btn{flex:1;justify-content:center;min-width:0}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:16px}
.breadcrumb a{color:var(--blue);text-decoration:none;cursor:pointer}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb span{color:var(--muted-2)}


/* Client view toggle */
.client-view-toggle{display:flex;gap:0;border:1px solid var(--border-2);border-radius:8px;overflow:hidden}
.client-view-toggle button{padding:8px 16px;font-size:13px;font-weight:500;border:none;background:var(--card);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;display:flex;align-items:center;gap:5px}
.client-view-toggle button.active{background:var(--blue);color:#fff}
.client-view-toggle button:not(:last-child){border-right:1px solid var(--border-2)}

/* Client month calendar grid */
.client-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
.client-cal-head{background:var(--card);padding:10px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.client-cal-day{background:var(--card);min-height:100px;padding:6px;vertical-align:top}
.client-cal-day.empty{background:var(--bg);opacity:.4}
.client-cal-day .ccd-num{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.client-cal-day .ccd-num.today{color:var(--blue);font-weight:700}
.client-cal-day .ccd-post{background:var(--bg);border-radius:4px;padding:4px 6px;margin-bottom:3px;font-size:10px;cursor:pointer;border-left:3px solid var(--green);transition:background .15s;overflow:hidden}
.client-cal-day .ccd-post:hover{background:var(--blue-light)}
.ccd-post .ccd-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccd-post .ccd-plats{display:flex;gap:1px;margin-top:2px;flex-wrap:wrap}
.ccd-post .ccd-plats .ptag{font-size:8px;padding:0 3px;border-radius:2px}
.ccd-post .ccd-thumb{width:100%;height:40px;object-fit:cover;border-radius:2px;margin-bottom:2px}

/* Client comment improvements */
.cc-comment-box{background:var(--bg);border-radius:8px;padding:12px;margin-top:8px}
.cc-thread{margin-left:0}
.cc-comment{padding:10px 0;border-bottom:1px solid var(--border)}
.cc-comment:last-of-type{border-bottom:none}
.cc-comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.cc-comment-row{display:flex;gap:8px;align-items:flex-start}
.cc-comment-body{flex:1;min-width:0}
.cc-comment-header{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.cc-comment-header strong{font-size:13px}
.cc-comment-header time{font-size:11px;color:var(--muted-2)}
.cc-comment-text{font-size:13px;line-height:1.5}
.cc-reply-btn{font-size:11px;color:var(--blue);background:none;border:none;cursor:pointer;padding:2px 0;margin-top:2px;font-family:inherit}
.cc-reply-btn:hover{text-decoration:underline}
.cc-replies{margin-left:36px;border-left:2px solid var(--border);padding-left:12px;margin-top:4px}
.cc-replies .cc-comment{padding:6px 0}
.cc-new-comment{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.cc-name-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.cc-name-row label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.cc-name-row input{flex:1;padding:8px 12px;border:1px solid var(--border-2);border-radius:6px;font-size:13px;font-family:inherit}
.cc-name-row input:focus{outline:none;border-color:var(--blue)}
.cc-msg-row{display:flex;gap:8px}
.cc-msg-row textarea{flex:1;padding:8px 12px;border:1px solid var(--border-2);border-radius:6px;font-size:13px;font-family:inherit;resize:none;min-height:40px}
.cc-msg-row textarea:focus{outline:none;border-color:var(--blue)}
.cc-msg-row .btn{align-self:flex-end}

/* Status badge in approval */
.cc-approval-status{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin-right:auto}
.cc-approval-status .status-icon{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Mobile responsive */
@media(max-width:768px){
  .client-wrap{padding:12px}
  .client-month-nav h2{font-size:22px;min-width:160px}
  .client-summary{grid-template-columns:repeat(2,1fr);gap:8px}
  .client-stat{padding:10px 12px}
  .client-stat .stat-num{font-size:22px}
  .client-cal-grid{font-size:11px}
  .client-cal-day{min-height:70px;padding:4px}
  .client-cal-day .ccd-post{font-size:9px;padding:2px 4px}
  .client-cal-day .ccd-thumb{height:28px}
  .client-card .cc-meta{flex-direction:column;align-items:flex-start}
  .client-card .cc-meta .cc-platforms{margin-top:4px}
  .cc-approval .btn{font-size:12px;padding:6px 10px;min-width:0}
  .sizer{display:none}
  .client-grid.sz-s,.client-grid.sz-m,.client-grid.sz-l{grid-template-columns:1fr}
  .client-view-toggle button{padding:6px 10px;font-size:12px}
}
@media(max-width:480px){
  .header h1{font-size:15px}
  .header img{height:32px}
  .client-month-nav h2{font-size:18px;min-width:120px}
  .client-card .cc-content{padding:12px}
  .cc-name-row{flex-direction:column;gap:4px}
  .cc-msg-row{flex-direction:column;gap:6px}
}
/* Tablet */
@media(min-width:769px) and (max-width:1024px){
  .client-grid{grid-template-columns:repeat(2,1fr)!important}
  .client-grid.sz-s{grid-template-columns:repeat(2,1fr)!important}
  .client-cal-day{min-height:90px}
}


/* Compact comments in grid views */
.sz-m .cc-comment-box,.sz-s .cc-comment-box{padding:8px}
.sz-m .cc-new-comment,.sz-s .cc-new-comment{padding-top:8px}
.sz-m .cc-name-row,.sz-s .cc-name-row{margin-bottom:4px}
.sz-m .cc-name-row label,.sz-s .cc-name-row label{display:none}
.sz-m .cc-msg-row textarea,.sz-s .cc-msg-row textarea{min-height:32px;font-size:12px}
.sz-s .cc-comment-avatar{display:none}
.sz-m .cc-approval,.sz-s .cc-approval{padding:10px 12px;flex-wrap:nowrap}
.sz-m .cc-approval .cc-approval-status,.sz-s .cc-approval .cc-approval-status{font-size:12px}
.sz-m .cc-content .cc-section p,.sz-s .cc-content .cc-section p{max-height:100px;overflow:hidden}
.sz-m .cc-comments,.sz-s .cc-comments{padding:0 12px 10px}

/* Clean up no-comments state */
.cc-no-comments{font-size:12px;color:var(--muted-2);padding:2px 0;font-style:italic}


/* Fix meta layout in grid cards */
.sz-m .client-card .cc-meta,.sz-s .client-card .cc-meta{flex-direction:column;align-items:flex-start;gap:6px}
.sz-m .client-card .cc-meta .cc-platforms,.sz-s .client-card .cc-meta .cc-platforms{margin-top:0}
.sz-m .client-card .cc-title,.sz-s .client-card .cc-title{font-size:15px}
.sz-s .client-card .cc-title{font-size:13px}
.sz-s .client-card .cc-day{width:32px;height:32px}
.sz-s .client-card .cc-day .cc-d{font-size:14px}
.sz-s .client-card .cc-day .cc-m{font-size:8px}


/* Caption edit */
.cc-section h4 .cc-reply-btn{margin-left:6px;font-size:11px}


/* Client feedback panel in editor */
.feedback-panel{border-radius:8px;padding:16px;margin-bottom:20px;border:2px solid var(--border)}
.feedback-panel.fb-approved{border-color:var(--green);background:#f0fdf4}
.feedback-panel.fb-declined{border-color:var(--amber);background:#fffbeb}
.feedback-panel.fb-none{border-color:var(--border);background:var(--bg)}
.feedback-panel .fb-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.feedback-panel .fb-status-tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 10px;border-radius:4px}
.fb-status-tag.approved{background:#dcfce7;color:#166534}
.fb-status-tag.declined{background:#fef3c7;color:#92400e}
.fb-status-tag.pending{background:#e5e7eb;color:#374151}
.feedback-panel .fb-title{font-size:14px;font-weight:600}
.feedback-panel .fb-comment{padding:8px 0;border-bottom:1px solid rgba(0,0,0,.08);display:flex;gap:8px;align-items:flex-start}
.feedback-panel .fb-comment:last-of-type{border-bottom:none}
.feedback-panel .fb-avatar{width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.feedback-panel .fb-cm-body{flex:1;min-width:0}
.feedback-panel .fb-cm-meta{font-size:11px;color:var(--muted);margin-bottom:1px}
.feedback-panel .fb-cm-meta strong{color:var(--text)}
.feedback-panel .fb-cm-text{font-size:13px;line-height:1.5}
.feedback-panel .fb-empty{font-size:13px;color:var(--muted-2);font-style:italic}

/* Calendar badges */
.day-post .dp-feedback{display:flex;gap:3px;align-items:center;margin-top:2px}
.dp-fb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dp-fb-dot.fb-ok{background:var(--green)}
.dp-fb-dot.fb-changes{background:var(--amber)}
.dp-comment-count{font-size:9px;color:var(--muted);font-weight:600}
.dp-approved-tick{color:var(--green);font-size:10px;font-weight:700}
.dp-changes-dot{color:var(--amber);font-size:10px;font-weight:700}

/* Approval card feedback badge */
.card-fb-badge{position:absolute;bottom:8px;left:8px;display:flex;gap:4px;align-items:center;z-index:2;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.card-fb-badge.fb-ok{background:rgba(22,163,74,.9);color:#fff}
.card-fb-badge.fb-changes{background:rgba(245,158,11,.9);color:#fff}
.card-fb-badge.fb-comments{background:rgba(0,0,0,.7);color:#fff}

/* Activity feed */
.activity-feed{margin-top:28px}
.activity-feed h2{font-size:20px;margin-bottom:4px}
.activity-feed .af-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.af-item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;background:var(--card);border-radius:8px;margin-bottom:6px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s}
.af-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);transform:translateY(-1px)}
.af-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;font-weight:700}
.af-icon.af-approved{background:#dcfce7;color:#166534}
.af-icon.af-declined{background:#fef3c7;color:#92400e}
.af-icon.af-comment{background:#dbeafe;color:#1e40af}
.af-body{flex:1;min-width:0}
.af-body .af-text{font-size:13px;line-height:1.4}
.af-body .af-text strong{font-weight:600}
.af-body .af-meta{font-size:11px;color:var(--muted);margin-top:2px}
.af-empty{text-align:center;padding:24px;color:var(--muted);font-size:13px;background:var(--card);border-radius:8px}


/* ===== PREMIUM DASHBOARD ===== */
:root{--gradient-blue:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);--gradient-green:linear-gradient(135deg,#16a34a 0%,#059669 100%);--gradient-amber:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%);--gradient-dark:linear-gradient(135deg,#1e1e2e 0%,#2d2b55 100%);--card-hover:0 8px 24px rgba(0,0,0,.12)}

/* Premium buttons */
.btn.primary{background:var(--gradient-blue);border:none;color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(79,70,229,.3)}
.btn.primary:hover{box-shadow:0 4px 16px rgba(79,70,229,.4);transform:translateY(-1px)}
.btn.gradient-green{background:var(--gradient-green);border:none;color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(22,163,74,.3)}
.btn.gradient-green:hover{box-shadow:0 4px 16px rgba(22,163,74,.4);transform:translateY(-1px)}

/* Dashboard layout */
.dash-layout{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
@media(max-width:1024px){.dash-layout{grid-template-columns:1fr}}
.dash-main{min-width:0}
.dash-sidebar{position:sticky;top:80px}
@media(max-width:1024px){.dash-sidebar{position:static}}

/* Dashboard header */
.dash-header{margin-bottom:24px}
.dash-header h2{font-size:32px;font-weight:700;margin-bottom:2px;background:var(--gradient-dark);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dash-header .dash-sub{color:var(--muted);font-size:14px}

/* Global stats bar */
.global-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:600px){.global-stats{grid-template-columns:repeat(2,1fr)}}
.g-stat{background:var(--card);border-radius:12px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.g-stat::after{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.g-stat.gs-total::after{background:var(--gradient-blue)}
.g-stat.gs-approved::after{background:var(--gradient-green)}
.g-stat.gs-pending::after{background:var(--gradient-amber)}
.g-stat.gs-cals::after{background:var(--gradient-dark)}
.g-stat .gs-num{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:var(--text);line-height:1}
.g-stat .gs-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}

/* Toolbar */
.dash-toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.dash-search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--border-2);border-radius:8px;font-size:14px;font-family:inherit;background:var(--card);transition:border-color .15s}
.dash-search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.dash-filters{display:flex;gap:4px}
.filter-btn{padding:6px 12px;font-size:12px;font-weight:500;border:1px solid var(--border-2);border-radius:6px;background:var(--card);cursor:pointer;font-family:inherit;transition:all .15s;color:var(--muted)}
.filter-btn:hover{border-color:var(--blue);color:var(--blue)}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Calendar cards with banners */
.cal-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;transition:all .2s;border:1px solid var(--border)}
.cal-card:hover{box-shadow:var(--card-hover);transform:translateY(-2px)}
.cal-card-banner{width:100%;height:80px;background:var(--gradient-dark);position:relative;overflow:hidden;cursor:pointer}
.cal-card-banner img{width:100%;height:100%;object-fit:cover}
.cal-card-banner .banner-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.4) 100%)}
.cal-card-banner .banner-edit{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s;font-family:inherit}
.cal-card:hover .banner-edit{opacity:1}
.cal-card-header{padding:14px 16px 8px}
.cal-card-header h3{font-size:17px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;margin-bottom:0}
.cal-card-header .cal-pin{font-size:11px;color:var(--muted)}
.cal-card-stats{display:flex;gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.cal-card-stats .ccs{flex:1;text-align:center;padding:10px 6px;border-right:1px solid var(--border)}
.cal-card-stats .ccs:last-child{border-right:none}
.cal-card-stats .ccs-n{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700}
.cal-card-stats .ccs-l{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.cal-card .progress-bar{height:4px;background:var(--bg);margin:0}
.cal-card .progress-fill{height:100%;background:var(--gradient-green);border-radius:0 2px 2px 0;transition:width .3s}
.cal-card-actions{padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap}
.cal-card-actions .btn{flex:1;justify-content:center;font-size:12px;min-width:0;padding:7px 8px}
.cal-card-actions .btn svg{width:14px;height:14px;flex-shrink:0}
.cal-card .last-activity{padding:0 16px 10px;font-size:11px;color:var(--muted)}

/* Activity sidebar */
.sidebar-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border)}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.sidebar-header .activity-count{background:var(--blue);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700}
.sidebar-body{max-height:600px;overflow-y:auto}
.af-item{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.af-item:hover{background:var(--bg)}
.af-item:last-child{border-bottom:none}
.af-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:700}
.af-body .af-text{font-size:12px;line-height:1.4}
.af-body .af-meta{font-size:10px;color:var(--muted-2);margin-top:2px}


/* Carousel uploads */
.creative-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.creative-thumb{width:100px;height:100px;border-radius:6px;overflow:hidden;position:relative;border:2px solid var(--border);cursor:pointer}
.creative-thumb img{width:100%;height:100%;object-fit:cover}
.creative-thumb video{width:100%;height:100%;object-fit:cover}
.creative-thumb .thumb-remove{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
.creative-thumb:hover .thumb-remove{display:flex}
.creative-thumb .thumb-idx{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.7);color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.creative-add-btn{width:100px;height:100px;border:2px dashed var(--border-2);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s;color:var(--muted);font-size:11px;gap:2px}
.creative-add-btn:hover{border-color:var(--blue);color:var(--blue)}
.creative-add-btn .plus{font-size:24px;line-height:1}

/* Client carousel viewer */
.carousel-wrap{position:relative;width:100%;background:#0a0a0a;overflow:hidden}
.carousel-track{display:flex;transition:transform .3s ease;touch-action:pan-y}
.carousel-track .carousel-slide{flex:0 0 100%;min-width:100%}
.carousel-track .carousel-slide img{width:100%;display:block;object-fit:contain;background:#0a0a0a}
.carousel-track .carousel-slide video{width:100%;display:block;background:#0a0a0a}
.carousel-nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2;transition:all .15s}
.carousel-nav:hover{background:#fff;transform:translateY(-50%) scale(1.1)}
.carousel-nav.prev{left:8px}
.carousel-nav.next{right:8px}
.carousel-dots{display:flex;gap:6px;justify-content:center;padding:8px 0;background:rgba(0,0,0,.03)}
.carousel-dots .dot{width:8px;height:8px;border-radius:50%;background:var(--border-2);cursor:pointer;transition:all .15s}
.carousel-dots .dot.active{background:var(--blue);transform:scale(1.2)}
.carousel-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;font-weight:600;z-index:2}

/* Client toolbar - prominent */
.client-toolbar{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:56px;z-index:10;border:1px solid var(--border)}
.client-toolbar .ct-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.client-toolbar .ct-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.client-filter{padding:6px 12px;font-size:12px;font-weight:500;border:1px solid var(--border-2);border-radius:6px;background:var(--card);cursor:pointer;font-family:inherit;transition:all .15s;color:var(--muted)}
.client-filter:hover{border-color:var(--blue);color:var(--blue)}
.client-filter.active{background:var(--gradient-blue);color:#fff;border-color:transparent}
@media(max-width:600px){
  .client-toolbar{padding:10px 12px;top:48px}
  .client-toolbar .ct-left,.client-toolbar .ct-right{width:100%;justify-content:space-between}
  .client-filter{padding:5px 8px;font-size:11px}
}


/* Approval card media fix */
.approval-card .card-media img{object-fit:contain;max-height:300px;width:100%;background:#0a0a0a}
.approval-card .card-media video{max-height:300px;width:100%;background:#0a0a0a}
.approval-card .card-media .carousel-wrap{width:100%}

/* Client view (legacy) */
.client-gate{max-width:400px;margin:80px auto;text-align:center}
.client-gate h2{font-size:28px;margin-bottom:8px}
.client-gate p{color:var(--muted);margin-bottom:20px}
.client-gate input{width:200px;text-align:center;font-size:20px;padding:12px;letter-spacing:8px;border:2px solid var(--border-2);border-radius:8px;margin-bottom:12px}
.client-gate input:focus{outline:none;border-color:var(--blue)}
.client-gate .error{color:var(--coral);font-size:13px;margin-top:8px}

/* Client post card */
.client-post{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.client-post-header{padding:16px 20px;border-bottom:1px solid var(--border)}
.client-post-header h3{font-size:16px;margin-bottom:4px}
.client-post-header .post-date{font-size:13px;color:var(--muted)}
.client-post-body{padding:20px}
.client-post-body .preview-img{width:100%;max-height:400px;object-fit:contain;border-radius:8px;margin-bottom:16px;background:#f0f0f0}
.client-post-body .caption-block{margin-bottom:16px}
.caption-block h4{font-size:13px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.caption-block p{font-size:14px;white-space:pre-wrap}
.client-actions{display:flex;gap:8px;padding:0 20px 16px}
.client-actions .btn.approve{background:#16a34a;color:#fff;border-color:#16a34a}
.client-actions .btn.approve.active{background:#15803d}
.client-actions .btn.reject{background:#ef4444;color:#fff;border-color:#ef4444}
.client-actions .btn.reject.active{background:#dc2626}
.client-actions .btn.approve:not(.active),.client-actions .btn.reject:not(.active){background:var(--card);color:var(--text)}

/* Lock toggle */
.lock-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:500}
.lock-toggle .lock-icon{font-size:16px}

/* Calendar list */
.cal-list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow)}
.cal-list-item .cal-info h3{font-size:16px}
.cal-list-item .cal-info p{font-size:13px;color:var(--muted)}
.cal-list-actions{display:flex;gap:6px}

/* Responsive */
@media(max-width:600px){
  .header{padding:12px 16px}.header h1{font-size:16px}.header img{height:36px}
  .container{padding:12px}
  .cal-day{min-height:80px;padding:4px}
  .cal-day .dn{font-size:11px}
  .day-post{font-size:10px;padding:2px 4px}
}

/* Print / PDF */
@media print{
  .header,.toolbar,.add-btn,.month-nav,.header-actions{display:none!important}
  .cal-grid{break-inside:avoid}
  .cal-day{min-height:90px}
  body{background:#fff}
}

/* View toggle */
.view-tabs{display:flex;gap:0;border:1px solid var(--border-2);border-radius:6px;overflow:hidden;margin-right:8px}
.view-tabs button{padding:6px 14px;font-size:12px;font-weight:500;border:none;background:var(--card);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.view-tabs button.active{background:var(--blue);color:#fff}
.view-tabs button:not(:last-child){border-right:1px solid var(--border-2)}

/* Approval cards */
.approval-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media(max-width:700px){.approval-grid{grid-template-columns:1fr}}
.approval-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.approval-card .card-media{width:100%;aspect-ratio:4/5;background:#111;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.approval-card .card-media img{width:100%;height:100%;object-fit:cover}
.approval-card .card-media video{width:100%;height:100%;object-fit:cover}
.approval-card .card-media .no-media{color:#555;font-size:13px}
.approval-card .card-channel{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:2}
.approval-card .card-status-badge{position:absolute;top:8px;right:8px;font-size:11px;padding:3px 8px;border-radius:4px;font-weight:600;z-index:2}
.approval-card .card-body{padding:14px;flex:1;display:flex;flex-direction:column}
.approval-card .card-topic{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:600;text-transform:uppercase;margin-bottom:4px}
.approval-card .card-date{font-size:12px;color:var(--muted);margin-bottom:8px}
.approval-card .card-caption{font-size:13px;line-height:1.5;color:var(--text);max-height:80px;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px;flex:1}
.approval-card .card-actions{display:flex;gap:6px;margin-top:auto}
.approval-card .card-actions .btn{flex:1;justify-content:center}
.btn.approved-active{background:var(--green);color:#fff;border-color:var(--green)}
.btn.declined-active{background:var(--coral);color:#fff;border-color:var(--coral)}

/* Client view - creative at top */
.client-post .creative-hero{width:100%;max-height:500px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.client-post .creative-hero img{width:100%;max-height:500px;object-fit:contain}
.client-post .creative-hero video{width:100%;max-height:500px}
.client-post .channel-strip{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--border)}
.channel-strip .ptag{font-size:11px;padding:3px 8px;border-radius:4px}
</style>
</head>

<!-- Client view container -->
<div id="clientApp" style="display:none"></div>

<script>
/* ========== CONFIG ========== */
const PLATFORMS = ['Facebook','Instagram','LinkedIn','X (Twitter)','TikTok','YouTube','Email','Blog','Other'];
const STATUSES = ['Draft','In Production','Ready to Review','Approved','Scheduled','Published'];
const CREATIVE_TYPES = ['','Static Image','Video','Video Carousel','Carousel','Reel','Story','Infographic','Blog Post','Email Template','Other'];
const DIMENSIONS = ['','1x1','4x5','9x16','16x9','Custom'];
const STATUS_COLORS = {'Draft':'#d1d5db','In Production':'#f59e0b','Ready to Review':'#f59e0b','Approved':'#16a34a','Scheduled':'#4f46e5','Published':'#16a34a'};
const PLAT_CLASS = {'Facebook':'facebook','Instagram':'instagram','LinkedIn':'linkedin','X (Twitter)':'x','TikTok':'tiktok','YouTube':'youtube','Email':'email','Blog':'blog','Other':'other'};

/* ========== STATE ========== */
let calendars = [];
let currentCalId = null;
let viewMode = 'year'; // year | month
let viewMonth = null; // Date object, first of month
let editorLocked = false;

/* ========== HELPERS ========== */
const $ = id => document.getElementById(id);
const esc = s => {const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(ds){try{return new Date(ds+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}catch(e){return ds;}}
function fmtDateShort(ds){try{return new Date(ds+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});}catch(e){return ds;}}
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ========== API ========== */
let apiOn = false;
async function loadCalendars(){
  try{const r=await fetch('/api/calendars');if(r.ok){const d=await r.json();apiOn=true;return d.calendars||[];}}catch(e){}
  try{return JSON.parse(localStorage.getItem('rich_calendars')||'[]');}catch(e){return [];}
}
async function saveCalendars(){
  if(apiOn){try{await fetch('/api/calendars',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(calendars)});}catch(e){}}
  try{localStorage.setItem('rich_calendars',JSON.stringify(calendars));}catch(e){}
}
async function loadCalendarClient(id,pin){
  try{const r=await fetch('/api/calendar?id='+encodeURIComponent(id)+'&pin='+encodeURIComponent(pin));
    if(r.status===403) return {error:'pin'};
    if(!r.ok) return {error:'notfound'};
    return await r.json();
  }catch(e){return {error:'network'};}
}
async function sendFeedback(id,pin,postId,data){
  try{await fetch('/api/calendar-feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,pin,postId,...data})});}catch(e){}
}

/* ========== INIT ========== */
async function init(){
  const params = new URLSearchParams(location.search);
  if(params.get('calendar')){
    clientMode(params.get('calendar'));
    return;
  }
  calendars = await loadCalendars();
  renderCalendarList();
}

/* ========== CALENDAR LIST ========== */
function renderCalendarList(){
  currentCalId = null;
  viewMode = 'year';
  $('backToListBtn').style.display = 'none';
  $('pdfBtn').style.display = 'none';
  $('lockToggle').style.display = 'none';
  $('pageTitle').textContent = 'Content Calendar // Admin';
  
  // Global stats
  let totalPosts=0, totalApproved=0, totalPending=0, totalComments=0;
  calendars.forEach(c=>{
    const posts = c.posts||[];
    totalPosts += posts.length;
    const fb = c.feedback||{};
    Object.values(fb).forEach(f=>{
      if(f.status==='approved') totalApproved++;
      totalComments += (f.comments||[]).length;
    });
  });
  totalPending = totalPosts - totalApproved;
  
  // Activity feed
  const allActivity = [];
  calendars.forEach(cal=>{
    const fb = cal.feedback||{};
    Object.keys(fb).forEach(postId=>{
      const entry = fb[postId];
      const post = (cal.posts||[]).find(p=>p.id===postId);
      const postName = post ? (post.topic||'Untitled') : 'Unknown';
      if(entry.status){
        const lastComment = (entry.comments||[]).slice(-1)[0];
        allActivity.push({type:entry.status==='approved'?'approved':'declined', calId:cal.id, calName:cal.name, postId, postName, d:lastComment?lastComment.d:null, by:lastComment?lastComment.by:'Client'});
      }
      (entry.comments||[]).forEach(cm=>{
        allActivity.push({type:'comment', calId:cal.id, calName:cal.name, postId, postName, d:cm.d, by:cm.by||'Client', text:cm.t||''});
      });
    });
  });
  allActivity.sort((a,b)=>((b.d||'')).localeCompare(a.d||''));
  const recentActivity = allActivity.slice(0,20);
  
  let html = '<div class="dash-header"><h2>Content Calendar</h2><p class="dash-sub">Manage client content calendars, track approvals, and review feedback.</p></div>';
  
  // Global stats
  html += `<div class="global-stats">
    <div class="g-stat gs-cals"><div class="gs-num">${calendars.length}</div><div class="gs-label">Calendars</div></div>
    <div class="g-stat gs-total"><div class="gs-num">${totalPosts}</div><div class="gs-label">Total posts</div></div>
    <div class="g-stat gs-approved"><div class="gs-num">${totalApproved}</div><div class="gs-label">Approved</div></div>
    <div class="g-stat gs-pending"><div class="gs-num">${totalPending}</div><div class="gs-label">Awaiting review</div></div>
  </div>`;
  
  html += '<div class="dash-layout"><div class="dash-main">';
  
  // Toolbar
  html += `<div class="dash-toolbar">
    <input class="dash-search" placeholder="Search calendars..." id="calSearch" oninput="filterDashboard()">
    <div class="dash-filters" id="dashFilters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" data-filter="attention" onclick="setFilter('attention')">Needs attention</button>
      <button class="filter-btn" data-filter="uptodate" onclick="setFilter('uptodate')">Up to date</button>
    </div>
    <button class="btn primary" onclick="createCalendar()">+ New calendar</button>
  </div>`;
  
  if(!calendars.length){
    html += '<div style="text-align:center;padding:60px 20px;color:var(--muted)"><p>No calendars yet. Create one to start planning content.</p></div>';
  } else {
    html += '<div class="cal-cards" id="calCardsGrid">';
    calendars.forEach(c => {
      const posts = c.posts||[];
      const count = posts.length;
      const fb = c.feedback||{};
      const approved = Object.values(fb).filter(f=>f.status==='approved').length;
      const declined = Object.values(fb).filter(f=>f.status==='declined').length;
      const pct = count ? Math.round((approved/count)*100) : 0;
      const needsAttention = declined > 0 || (count > 0 && approved < count);
      
      // Last activity
      const calComments = [];
      Object.values(fb).forEach(f=>(f.comments||[]).forEach(cm=>calComments.push(cm)));
      calComments.sort((a,b)=>((b.d||'')).localeCompare(a.d||''));
      const lastAct = calComments[0];
      
      html += `<div class="cal-card" data-name="${esc(c.name.toLowerCase())}" data-attention="${needsAttention}">
        <div class="cal-card-banner" onclick="openCalendar('${c.id}')">
          ${c.banner ? `<img src="${c.banner}" alt="">` : ''}
          <div class="banner-overlay"></div>
          <button class="banner-edit" onclick="event.stopPropagation();uploadBanner('${c.id}')">Change image</button>
        </div>
        <input type="file" id="banner-${c.id}" accept="image/*" style="display:none" onchange="handleBanner('${c.id}')">
        <div class="cal-card-header">
          <h3>${esc(c.name)}</h3>
          <div class="cal-pin">PIN: ${esc(c.pin||'')} &middot; ${c.created?new Date(c.created).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):''}</div>
        </div>
        <div class="cal-card-stats">
          <div class="ccs"><div class="ccs-n">${count}</div><div class="ccs-l">Posts</div></div>
          <div class="ccs"><div class="ccs-n" style="color:var(--green)">${approved}</div><div class="ccs-l">Approved</div></div>
          <div class="ccs"><div class="ccs-n" style="color:${declined?'var(--amber)':'var(--muted-2)'}">${declined}</div><div class="ccs-l">Changes</div></div>
          <div class="ccs"><div class="ccs-n">${pct}%</div><div class="ccs-l">Complete</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${lastAct ? `<div class="last-activity">Last: <strong>${esc(lastAct.by||'Client')}</strong> &middot; ${lastAct.d?new Date(lastAct.d).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</div>` : ''}
        <div class="cal-card-actions">
          <button class="btn sm primary" onclick="openCalendar('${c.id}')">Edit</button>
          <button class="btn sm" onclick="previewAsClient('${c.id}')">Preview</button>
          <button class="btn sm" onclick="copyCalLink('${c.id}')">Copy link</button>
          <button class="btn sm ghost" onclick="calSettings('${c.id}')">Settings</button>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  
  html += '</div>'; // close dash-main
  
  // Sidebar
  html += '<div class="dash-sidebar"><div class="sidebar-card">';
  html += `<div class="sidebar-header"><h3>Activity ${recentActivity.length?`<span class="activity-count">${recentActivity.length}</span>`:''}</h3></div>`;
  html += '<div class="sidebar-body">';
  
  if(!recentActivity.length){
    html += '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">No client activity yet.</div>';
  } else {
    recentActivity.forEach(a=>{
      let icon='', text='';
      if(a.type==='approved'){
        icon = '<div class="af-icon af-approved">&#10003;</div>';
        text = `<strong>${esc(a.postName)}</strong> approved`;
      } else if(a.type==='declined'){
        icon = '<div class="af-icon af-declined">!</div>';
        text = `Changes requested on <strong>${esc(a.postName)}</strong>`;
      } else {
        icon = `<div class="af-icon af-comment">${(a.by||'?')[0].toUpperCase()}</div>`;
        text = `<strong>${esc(a.by)}</strong>: ${esc((a.text||'').substring(0,80))}${(a.text||'').length>80?'...':''}`;
      }
      const timeAgo = a.d ? getTimeAgo(new Date(a.d)) : '';
      html += `<div class="af-item" onclick="openCalendarToPost('${a.calId}','${a.postId}')">
        ${icon}
        <div class="af-body"><div class="af-text">${text}</div><div class="af-meta">${esc(a.calName)}${timeAgo?' &middot; '+timeAgo:''}</div></div>
      </div>`;
    });
  }
  
  html += '</div></div></div>'; // close sidebar
  html += '</div>'; // close dash-layout
  
  $('app').innerHTML = html;
}

function getTimeAgo(date){
  const now = new Date();
  const diff = Math.floor((now-date)/1000);
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  if(diff<604800) return Math.floor(diff/86400)+'d ago';
  return date.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

let dashFilter = 'all';
function setFilter(f){
  dashFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));
  filterDashboard();
}
function filterDashboard(){
  const q = (document.getElementById('calSearch')?.value||'').toLowerCase();
  document.querySelectorAll('.cal-card').forEach(card=>{
    const name = card.dataset.name||'';
    const attention = card.dataset.attention==='true';
    let show = name.includes(q);
    if(dashFilter==='attention') show = show && attention;
    if(dashFilter==='uptodate') show = show && !attention;
    card.style.display = show ? '' : 'none';
  });
}

function uploadBanner(calId){
  document.getElementById('banner-'+calId)?.click();
}
function handleBanner(calId){
  const input = document.getElementById('banner-'+calId);
  const file = input?.files?.[0]; if(!file) return;
  if(file.size > 3*1024*1024){alert('Image too large. Please use under 3MB.');return;}
  const reader = new FileReader();
  reader.onload = function(e){
    const c = calendars.find(x=>x.id===calId); if(!c) return;
    c.banner = e.target.result;
    saveCalendars();
    renderCalendarList();
  };
  reader.readAsDataURL(file);
}

function openCalendarToPost(calId, postId){
  openCalendar(calId);
  setTimeout(()=>{editPost(postId);},300);
}

function previewAsClient(id){
  const url = location.origin + location.pathname + '?calendar=' + id;
  window.open(url, '_blank');
}

function createCalendar(){
  const name = prompt('Calendar name (e.g. Client Name - September)');
  if(!name) return;
  const c = {id:'cal_'+uid(), name, pin:String(Math.floor(1000+Math.random()*9000)), created:new Date().toISOString(), posts:[], feedback:{}};
  calendars.unshift(c);
  saveCalendars();
  openCalendar(c.id);
}

function copyCalLink(id){
  const url = location.origin + location.pathname + '?calendar=' + id;
  navigator.clipboard.writeText(url).then(()=>alert('Link copied')).catch(()=>prompt('Copy this link:',url));
}

function calSettings(id){
  const c = calendars.find(x=>x.id===id); if(!c) return;
  $('settingsBody').innerHTML = `
    <div class="field"><label>Calendar name</label><input id="sName" value="${esc(c.name)}"></div>
    <div class="field"><label>Client PIN</label><input id="sPin" value="${esc(c.pin||'')}"></div>
    <div class="field"><label>Intro message (shown to client)</label><textarea id="sIntro" rows="3">${esc(c.intro||'')}</textarea></div>
    <div style="margin-top:20px"><button class="btn danger sm" onclick="deleteCalendar('${c.id}')">Delete calendar</button></div>`;
  $('settingsFoot').innerHTML = `<button class="btn" onclick="closeSettings()">Cancel</button><button class="btn primary" onclick="saveSettings('${c.id}')">Save</button>`;
  $('settingsModal').classList.add('show');
  $('settingsClose').onclick = closeSettings;
}
function closeSettings(){$('settingsModal').classList.remove('show');}
function saveSettings(id){
  const c = calendars.find(x=>x.id===id); if(!c) return;
  c.name = $('sName').value.trim()||c.name;
  c.pin = $('sPin').value.trim()||c.pin;
  c.intro = $('sIntro').value.trim();
  saveCalendars(); closeSettings();
  if(currentCalId===id) renderCalendarView(); else renderCalendarList();
}
function deleteCalendar(id){
  if(!confirm('Delete this calendar permanently?')) return;
  calendars = calendars.filter(x=>x.id!==id);
  saveCalendars(); closeSettings(); renderCalendarList();
}

/* ========== CALENDAR VIEW (Year + Month) ========== */
function openCalendar(id){
  currentCalId = id;
  const c = calendars.find(x=>x.id===id); if(!c) return;
  viewMode = 'year';
  editorLocked = false;
  updateLock();
  $('backToListBtn').style.display = '';
  $('backToListBtn').onclick = ()=>renderCalendarList();
  $('backToListBtn').textContent = 'Dashboard';
  $('pdfBtn').style.display = '';
  $('lockToggle').style.display = 'flex';
  renderCalendarView();
}

function renderCalendarView(){
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  $('pageTitle').textContent = c.name + ' // ' + (editorLocked?'Locked':'Editor');
  if(viewMode==='year') renderYearView(c);
  else if(viewMode==='approval') renderApprovalView(c);
  else renderMonthView(c);
}

function updateLock(){
  $('lockIcon').innerHTML = editorLocked ? '&#128274;' : '&#128275;';
  $('lockLabel').textContent = editorLocked ? 'Unlock editor' : 'Lock editor';
}
$('lockToggle').onclick = ()=>{editorLocked=!editorLocked;updateLock();renderCalendarView();};

function renderYearView(c){
  const today = new Date();
  const year = viewMonth ? viewMonth.getFullYear() : today.getFullYear();
  const posts = c.posts||[];
  
  let html = `<div class="toolbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="month-nav" onclick="yearNav(-1)">&lsaquo;</button>
      <h2 style="font-size:32px;min-width:80px;text-align:center">${year}</h2>
      <button class="month-nav" onclick="yearNav(1)">&rsaquo;</button>
    </div>
  </div>`;
  
  html += '<div class="year-grid">';
  for(let m=0;m<12;m++){
    const daysInMonth = new Date(year,m+1,0).getDate();
    const firstDay = (new Date(year,m,1).getDay()+6)%7; // Mon=0
    const monthPosts = posts.filter(p=>{const d=new Date(p.date+'T00:00:00');return d.getFullYear()===year&&d.getMonth()===m;});
    const postDays = new Set(monthPosts.map(p=>new Date(p.date+'T00:00:00').getDate()));
    
    let grid = '<div class="mini-grid">';
    const dayLabels = ['M','T','W','T','F','S','S'];
    dayLabels.forEach(d=>{grid+=`<div style="font-weight:600;color:var(--muted-2)">${d}</div>`;});
    for(let i=0;i<firstDay;i++) grid+='<div class="day"></div>';
    for(let d=1;d<=daysInMonth;d++){
      const isToday = d===today.getDate()&&m===today.getMonth()&&year===today.getFullYear();
      const hasPost = postDays.has(d);
      grid += `<div class="day${hasPost?' has-post':''}${isToday?' today':''}">${d}</div>`;
    }
    grid += '</div>';
    
    html += `<div class="month-card" onclick="goToMonth(${year},${m})">
      <h3>${MONTH_NAMES[m]}</h3>${grid}
      ${monthPosts.length?`<div class="post-count">${monthPosts.length} post${monthPosts.length!==1?'s':''}</div>`:''}
    </div>`;
  }
  html += '</div>';
  $('app').innerHTML = html;
}

function yearNav(dir){
  if(!viewMonth) viewMonth = new Date();
  viewMonth.setFullYear(viewMonth.getFullYear()+dir);
  renderCalendarView();
}

function goToMonth(y,m){
  viewMonth = new Date(y,m,1);
  viewMode = 'month';
  renderCalendarView();
}

function renderMonthView(c){
  const vm = viewMonth || new Date();
  const year = vm.getFullYear(), month = vm.getMonth();
  const today = new Date();
  const posts = (c.posts||[]).filter(p=>{const d=new Date(p.date+'T00:00:00');return d.getFullYear()===year&&d.getMonth()===month;});
  const daysInMonth = new Date(year,month+1,0).getDate();
  const firstDay = (new Date(year,month,1).getDay()+6)%7;
  
  let html = `<div class="toolbar">
    <button class="btn sm" onclick="viewMode='year';renderCalendarView()">&lsaquo; Year</button>
    <div class="month-header">
      <button class="month-nav" onclick="monthNav(-1)">&lsaquo;</button>
      <h2>${MONTH_NAMES[month]} ${year}</h2>
      <button class="month-nav" onclick="monthNav(1)">&rsaquo;</button>
    </div>
    <div style="display:flex;gap:6px">
      ${editorLocked?'':'<button class="btn sm primary" onclick="addPost()">+ Add post</button>'}
    <div class="view-tabs">
      <button class="${viewMode==='month'?'active':''}" onclick="viewMode='month';renderCalendarView()">Calendar</button>
      <button class="${viewMode==='approval'?'active':''}" onclick="viewMode='approval';renderCalendarView()">Approval</button>
    </div>
    </div>
  </div>`;
  
  if(!editorLocked){
    html += '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">Click a day to add or edit content. Drag a post to another day to reschedule.</div>';
  }
  
  html += '<div class="cal-grid">';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>{html+=`<div class="cal-head">${d}</div>`;});
  
  for(let i=0;i<firstDay;i++) html+='<div class="cal-day empty"></div>';
  
  for(let d=1;d<=daysInMonth;d++){
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const dayPosts = posts.filter(p=>p.date===ds);
    
    html += `<div class="cal-day" ondrop="dropPost(event,'${ds}')" ondragover="event.preventDefault()">
      <div class="dn${isToday?' today':''}">${d}</div>`;
    
    dayPosts.forEach(p=>{
      const sc = STATUS_COLORS[p.status]||'#d1d5db';
      const plats = (p.platforms||[]).map(pl=>`<span class="ptag ${PLAT_CLASS[pl]||'other'}">${pl.replace('X (Twitter)','X')}</span>`).join('');
      const pfb = (c.feedback&&c.feedback[p.id])||{status:'',comments:[]};
      const pfbCount = (pfb.comments||[]).length;
      let fbIndicator = '';
      if(pfb.status==='approved') fbIndicator = '<span class="dp-approved-tick">&#10003;</span>';
      else if(pfb.status==='declined') fbIndicator = '<span class="dp-changes-dot">!</span>';
      if(pfbCount) fbIndicator += `<span class="dp-comment-count">${pfbCount}</span>`;
      html += `<div class="day-post" draggable="${editorLocked?'false':'true'}" ondragstart="dragPost(event,'${p.id}')" onclick="editPost('${p.id}')" style="border-left-color:${sc}">
        <div class="dp-title"><span class="status-dot" style="background:${sc}"></span>${esc(p.topic||'Untitled')}${fbIndicator?'<span class="dp-feedback">'+fbIndicator+'</span>':''}</div>
        ${plats?`<div class="dp-platforms">${plats}</div>`:''}
      </div>`;
    });
    
    if(!editorLocked) html += `<div class="add-btn" onclick="addPost('${ds}')">+ Add</div>`;
    html += '</div>';
  }
  // Fill remaining cells
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - (totalCells%7))%7;
  for(let i=0;i<remaining;i++) html+='<div class="cal-day empty"></div>';
  
  html += '</div>';
  $('app').innerHTML = html;
}

function monthNav(dir){
  viewMonth.setMonth(viewMonth.getMonth()+dir);
  renderCalendarView();
}


/* ========== APPROVAL VIEW ========== */
function renderApprovalView(c){
  const vm = viewMonth || new Date();
  const year = vm.getFullYear(), month = vm.getMonth();
  const allPosts = (c.posts||[]);
  const monthPosts = allPosts.filter(p=>{const d=new Date(p.date+'T00:00:00');return d.getFullYear()===year&&d.getMonth()===month;}).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  
  let html = `<div class="toolbar">
    <button class="btn sm" onclick="viewMode='year';renderCalendarView()">&lsaquo; Year</button>
    <div class="month-header">
      <button class="month-nav" onclick="monthNav(-1)">&lsaquo;</button>
      <h2>${MONTH_NAMES[month]} ${year}</h2>
      <button class="month-nav" onclick="monthNav(1)">&rsaquo;</button>
    </div>
    <div style="display:flex;gap:6px">
      ${editorLocked?'':'<button class="btn sm primary" onclick="addPost()">+ Add post</button>'}
      <div class="view-tabs">
        <button class="${viewMode==='month'?'active':''}" onclick="viewMode='month';renderCalendarView()">Calendar</button>
        <button class="active" onclick="">Approval</button>
      </div>
    </div>
  </div>`;
  
  if(!monthPosts.length){
    html += '<div style="text-align:center;padding:40px;color:var(--muted)">No posts this month.</div>';
    $('app').innerHTML = html;
    return;
  }
  
  html += '<div class="approval-grid">';
  monthPosts.forEach(p=>{
    const sc = STATUS_COLORS[p.status]||'#d1d5db';
    const plats = (p.platforms||[]).map(pl=>`<span class="ptag ${PLAT_CLASS[pl]||'other'}">${pl.replace('X (Twitter)','X')}</span>`).join('');
    const fb = (c.feedback&&c.feedback[p.id])||{status:'',comments:[]};
    
    // Determine media source - carousel or single
    let mediaHTML = '<div class="no-media">No creative</div>';
    const aSlides = p.carouselEN||[];
    if(aSlides.length > 1){
      const aCarId = 'acar-'+p.id;
      let aSlidesHTML = aSlides.map((s,i)=>{
        const src = `/api/creative?calId=${currentCalId}&postId=${p.id}&lang=EN-${i}`;
        return `<div class="carousel-slide">${s.type==='video'?`<video src="${src}" controls></video>`:`<img src="${src}" alt="">`}</div>`;
      }).join('');
      mediaHTML = `<div class="carousel-wrap" style="aspect-ratio:4/5"><div class="carousel-count">${aSlides.length}</div><div class="carousel-track" id="${aCarId}" style="transform:translateX(0)">${aSlidesHTML}</div><button class="carousel-nav prev" onclick="event.stopPropagation();carouselNav('${aCarId}',-1)">&lsaquo;</button><button class="carousel-nav next" onclick="event.stopPropagation();carouselNav('${aCarId}',1)">&rsaquo;</button><div class="carousel-dots" id="${aCarId}-dots">${aSlides.map((_,i)=>`<div class="dot ${i===0?'active':''}" onclick="event.stopPropagation();carouselGo('${aCarId}',${i})"></div>`).join('')}</div></div>`;
    } else if(p.creativesEN){
      mediaHTML = `<img src="${p.creativesEN}" alt="">`;
    } else if(p.hasCreativeEN){
      if(p.creativeENType==='video'){
        mediaHTML = `<video src="/api/creative?calId=${currentCalId}&postId=${p.id}&lang=EN" controls onclick="event.stopPropagation()"></video>`;
      } else {
        mediaHTML = `<img src="/api/creative?calId=${currentCalId}&postId=${p.id}&lang=EN" alt="">`;
      }
    }
    
    const statusBg = {Draft:'#e5e7eb','In Production':'#fef3c7','Ready to Review':'#fef3c7',Approved:'#dcfce7',Scheduled:'#dbeafe',Published:'#dcfce7'};
    const statusFg = {Draft:'#374151','In Production':'#92400e','Ready to Review':'#92400e',Approved:'#166534',Scheduled:'#1e40af',Published:'#166534'};
    
    const apfb = (c.feedback&&c.feedback[p.id])||{status:'',comments:[]};
    const apfbCount = (apfb.comments||[]).length;
    let apfbBadge = '';
    if(apfb.status==='approved') apfbBadge = '<div class="card-fb-badge fb-ok">&#10003; Client approved</div>';
    else if(apfb.status==='declined') apfbBadge = '<div class="card-fb-badge fb-changes">! Changes requested</div>';
    else if(apfbCount) apfbBadge = `<div class="card-fb-badge fb-comments">${apfbCount} comment${apfbCount!==1?'s':''}</div>`;
    
    html += `<div class="approval-card">
      <div class="card-media" onclick="editPost('${p.id}')">
        ${mediaHTML}
        <div class="card-channel">${plats}</div>
        <div class="card-status-badge" style="background:${statusBg[p.status]||'#e5e7eb'};color:${statusFg[p.status]||'#374151'}">${esc(p.status||'Draft')}</div>
        ${apfbBadge}
      </div>
      <div class="card-body">
        <div class="card-topic">${esc(p.topic||'Untitled')}</div>
        <div class="card-date">${fmtDate(p.date)}</div>
        <div class="card-caption">${esc(p.captionEN||p.caption||'')}</div>
        ${apfbCount ? `<div style="font-size:12px;color:var(--muted);margin-bottom:6px;border-top:1px solid var(--border);padding-top:8px"><strong>${esc((apfb.comments[apfb.comments.length-1]||{}).by||'Client')}:</strong> ${esc(((apfb.comments[apfb.comments.length-1]||{}).t||'').substring(0,80))}${(apfb.comments[apfb.comments.length-1]||{}).t&&(apfb.comments[apfb.comments.length-1]).t.length>80?'...':''}</div>`:''}
        <div class="card-actions">
          <button class="btn sm ${fb.status==='approved'?'approved-active':''}" onclick="teamApprove('${p.id}','approved')">Approve</button>
          <button class="btn sm ${fb.status==='declined'?'declined-active':''}" onclick="teamApprove('${p.id}','declined')">Needs changes</button>
          <button class="btn sm ghost" onclick="editPost('${p.id}')">Edit</button>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  $('app').innerHTML = html;
}

async function teamApprove(postId, status){
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  c.feedback = c.feedback||{};
  c.feedback[postId] = c.feedback[postId]||{status:'',comments:[]};
  c.feedback[postId].status = (c.feedback[postId].status===status) ? '' : status;
  await saveCalendars();
  renderCalendarView();
}

/* ========== DRAG & DROP ========== */
let dragPostId = null;
function dragPost(e,id){dragPostId=id;e.dataTransfer.effectAllowed='move';}
function dropPost(e,date){
  e.preventDefault();
  if(!dragPostId||editorLocked) return;
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  const p = (c.posts||[]).find(x=>x.id===dragPostId);
  if(p){p.date=date;saveCalendars();renderCalendarView();}
  dragPostId=null;
}

/* ========== POST EDITOR ========== */
function addPost(date){
  if(editorLocked) return;
  const c = calendars.find(x=>x.id===currentCalId); if(!c) return;
  c.posts = c.posts||[];
  const p = {id:'p_'+uid(), date:date||todayStr(), topic:'', status:'Draft', platforms:['Facebook','Instagram'],
    creativeType:'', dimensions:'', brief:'', captionEN:'', captionAR:'', visualCopyEN:'', visualCopyAR:'',
    creativeDirection:'', clickupLink:'', assets:[], videoScript:[], creativesEN:'', creativesAR:'',
    comments:[]};
  c.posts.push(p);
  saveCalendars();
  editPost(p.id);
}
