<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f6;--card:#fff;--text:#111;--muted:#6b7280;--muted-2:#9ca3af;--border:#e5e7eb;--border-2:#d1d5db;
  --blue:#4f46e5;--blue-light:#eef2ff;--green:#16a34a;--green-light:#f0fdf4;--amber:#f59e0b;--amber-light:#fffbeb;--red:#dc2626;--red-light:#fef2f2;--purple:#7c3aed;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --gradient-blue:linear-gradient(135deg,#4f46e5,#7c3aed);--gradient-green:linear-gradient(135deg,#16a34a,#059669);--gradient-amber:linear-gradient(135deg,#f59e0b,#ea580c);
  --internal:#0f0f14;--internal-accent:#fbbf24;--client:#4f46e5;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em}
a{color:var(--blue)}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* ============ SHARED COMPONENTS ============ */
.btn{font-size:13px;font-weight:500;padding:8px 16px;border-radius:7px;border:1px solid var(--border-2);background:var(--card);color:var(--text);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--gradient-blue);border:none;color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(79,70,229,.25)}
.btn.primary:hover{box-shadow:0 4px 14px rgba(79,70,229,.35);transform:translateY(-1px);color:#fff}
.btn.success{background:var(--gradient-green);border:none;color:#fff;font-weight:600}
.btn.success:hover{box-shadow:0 4px 14px rgba(22,163,74,.35);transform:translateY(-1px);color:#fff}
.btn.warning{background:var(--gradient-amber);border:none;color:#fff;font-weight:600}
.btn.warning:hover{box-shadow:0 4px 14px rgba(245,158,11,.35);transform:translateY(-1px);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red-light)}
.btn.ghost{border:none;background:transparent}
.btn.ghost:hover{background:rgba(0,0,0,.05)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11px}
.btn.outline-green{border:2px solid var(--green);color:var(--green);background:transparent;font-weight:600}
.btn.outline-green:hover,.btn.outline-green.active{background:var(--green);color:#fff}
.btn.outline-amber{border:2px solid var(--amber);color:var(--amber);background:transparent;font-weight:600}
.btn.outline-amber:hover,.btn.outline-amber.active{background:var(--amber);color:#fff}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px;white-space:nowrap}
.badge.draft{background:#f3f4f6;color:#4b5563}
.badge.review{background:#dbeafe;color:#1d4ed8}
.badge.approved{background:#dcfce7;color:#166534}
.badge.changes{background:#fef3c7;color:#92400e}
.badge.revised{background:#e0e7ff;color:#4338ca}
.badge.scheduled{background:#f3e8ff;color:#6b21a8}
.badge.published{background:#dcfce7;color:#166534}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;font-size:14px;padding:9px 12px;border:1px solid var(--border-2);border-radius:7px;background:var(--card);color:var(--text);transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}
.check-row{display:flex;flex-wrap:wrap;gap:10px}
.check-row label{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);cursor:pointer}
.check-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue)}

/* Platform icons */
.plat-icon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;flex-shrink:0}
.plat-icon svg{width:14px;height:14px}
.plat-icons{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

/* Carousel */
.carousel{position:relative;width:100%;height:100%;overflow:hidden;background:#0a0a0a}
.carousel-track{display:flex;height:100%;transition:transform .3s ease}
.carousel-slide{flex:0 0 100%;min-width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.carousel-slide img,.carousel-slide video{width:100%;height:100%;object-fit:cover}
.carousel-nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:3;transition:all .15s}
.carousel-nav:hover{background:#fff;transform:translateY(-50%) scale(1.1)}
.carousel-nav.prev{left:8px}.carousel-nav.next{right:8px}
.carousel-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:5px;justify-content:center;z-index:3}
.carousel-dots .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;transition:all .15s}
.carousel-dots .dot.active{background:#fff;transform:scale(1.3)}
.carousel-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600;z-index:3}

/* Fullscreen viewer */
.fullview{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center}
.fullview .fv-close{position:absolute;top:16px;right:16px;color:#fff;font-size:32px;background:none;border:none;cursor:pointer;z-index:2;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.fullview .fv-close:hover{background:rgba(255,255,255,.1)}
.fullview .fv-stage{position:relative;width:92vw;height:88vh;display:flex;align-items:center;justify-content:center}
.fullview .fv-stage img,.fullview .fv-stage video{max-width:100%;max-height:100%;object-fit:contain}
.fullview .fv-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);border:none;font-size:24px;cursor:pointer;z-index:2;box-shadow:0 2px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.fullview .fv-nav:hover{background:#fff}
.fullview .fv-nav.prev{left:0}.fullview .fv-nav.next{right:0}
.fullview .fv-counter{position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:6px 16px;border-radius:20px;font-size:14px;font-weight:500}
.fullview .fv-label{position:absolute;top:0;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;display:none;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}
.modal-overlay.show{display:flex;justify-content:center;align-items:flex-start}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:960px;margin:12px auto;box-shadow:var(--shadow-lg);max-height:calc(100vh - 48px);display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head h2{font-size:18px}
.modal-close{background:none;border:none;font-size:26px;cursor:pointer;color:var(--muted);padding:4px 8px;line-height:1}
.modal-body{padding:22px;overflow-y:auto;flex:1;min-height:0}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-shrink:0;background:var(--bg)}
.modal-foot .left{display:flex;gap:8px}.modal-foot .right{display:flex;gap:8px}

/* Comments */
.comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.comment:last-of-type{border-bottom:none}
.comment.resolved{opacity:.55}
.comment.resolved .comment-text{text-decoration:line-through}
.comment-avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.comment-avatar.client{background:var(--purple)}
.comment-avatar.team{background:#374151}
.comment-body{flex:1;min-width:0}
.comment-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.comment-head strong{font-size:13px}
.comment-head time{font-size:11px;color:var(--muted-2)}
.comment-text{font-size:13px;line-height:1.5;word-break:break-word}
.comment-actions{display:flex;gap:4px;margin-left:auto}
.comment-actions button{font-size:11px;background:none;border:none;color:var(--blue);cursor:pointer;padding:2px 5px}
.comment-actions button:hover{text-decoration:underline}
.comment-actions button.del{color:var(--red)}
.comment-form{display:flex;gap:6px;margin-top:10px;align-items:flex-start}
.comment-form input[type=text]{flex:0 0 100px;padding:8px 10px;border:1px solid var(--border-2);border-radius:6px;font-size:13px}
.comment-form textarea{flex:1;padding:8px 10px;border:1px solid var(--border-2);border-radius:6px;font-size:13px;resize:none;min-height:38px;line-height:1.4}
.comment-form .btn{align-self:stretch}
.comment-form input:focus,.comment-form textarea:focus{outline:none;border-color:var(--blue)}

/* ============ INTERNAL (AGENCY) ============ */
.int-header{background:var(--internal);color:#fff;padding:0 24px;height:64px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--internal-accent)}
.int-header img{height:40px}
.int-header .int-badge{background:var(--internal-accent);color:var(--internal);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:5px 12px;border-radius:4px}
.int-header h1{font-size:18px;font-weight:600;flex:1;color:#fff}
.int-header .int-actions{display:flex;gap:8px;align-items:center}
.int-header .btn{border-color:rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.08)}
.int-header .btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:#fff}
.int-wrap{max-width:1400px;margin:0 auto;padding:24px}

/* Internal dashboard */
.int-dash-head{margin-bottom:24px}
.int-dash-head h2{font-size:32px;font-weight:700;margin-bottom:4px}
.int-dash-head p{color:var(--muted);font-size:14px}
.int-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
@media(max-width:900px){.int-stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.int-stats{grid-template-columns:repeat(2,1fr)}}
.int-stat{background:var(--card);border-radius:10px;padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--border-2)}
.int-stat.s-calendars{border-left-color:var(--internal)}
.int-stat.s-review{border-left-color:var(--blue)}
.int-stat.s-changes{border-left-color:var(--amber)}
.int-stat.s-approved{border-left-color:var(--green)}
.int-stat.s-unresolved{border-left-color:var(--red)}
.int-stat .n{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1}
.int-stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.int-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.int-toolbar input[type=search]{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--border-2);border-radius:8px;font-size:14px;background:var(--card)}
.int-toolbar input[type=search]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.int-layout{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
@media(max-width:1100px){.int-layout{grid-template-columns:1fr}}
.cal-grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.cal-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border);transition:all .2s}
.cal-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.cal-card .banner{height:90px;background:linear-gradient(135deg,#1e1e2e,#2d2b55);position:relative;overflow:hidden;cursor:pointer}
.cal-card .banner img{width:100%;height:100%;object-fit:cover}
.cal-card .banner .banner-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:4px;padding:4px 9px;font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s}
.cal-card:hover .banner-btn{opacity:1}
.cal-card .body{padding:14px 16px}
.cal-card h3{font-size:17px;font-weight:700;margin-bottom:2px}
.cal-card .meta{font-size:11px;color:var(--muted);margin-bottom:10px}
.cal-card .pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.cal-card .pills .badge{font-size:10px}
.cal-card .progress{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:12px}
.cal-card .progress div{height:100%;background:var(--gradient-green);transition:width .3s}
.cal-card .actions{display:flex;gap:6px}
.cal-card .actions .btn{flex:1;font-size:12px;padding:7px 8px}
.activity-panel{background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);position:sticky;top:88px}
.activity-panel .ap-head{padding:14px 16px;border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.activity-panel .ap-head .count{background:var(--red);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;font-family:'Inter',sans-serif}
.activity-panel .ap-body{max-height:70vh;overflow-y:auto}
.activity-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.activity-item:hover{background:var(--bg)}
.activity-item:last-child{border-bottom:none}
.activity-item .ai-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.ai-icon.approved{background:#dcfce7;color:#166534}
.ai-icon.changes{background:#fef3c7;color:#92400e}
.ai-icon.comment{background:#ede9fe;color:#5b21b6}
.activity-item .ai-text{font-size:12px;line-height:1.4}
.activity-item .ai-meta{font-size:10px;color:var(--muted-2);margin-top:2px}

/* Internal calendar editor */
.int-cal-toolbar{background:var(--card);border-radius:10px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--border);border-top:3px solid var(--internal)}
.int-cal-toolbar .left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.int-cal-toolbar .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.int-cal-toolbar h2{font-size:22px;min-width:160px;text-align:center}
.month-nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--border-2);background:var(--card);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.month-nav:hover{border-color:var(--blue);color:var(--blue)}
.view-tabs{display:flex;border:1px solid var(--border-2);border-radius:7px;overflow:hidden}
.view-tabs button{padding:7px 14px;font-size:12px;font-weight:500;border:none;background:var(--card);cursor:pointer;color:var(--muted)}
.view-tabs button.active{background:var(--internal);color:#fff}
.view-tabs button:not(:last-child){border-right:1px solid var(--border-2)}
.filter-pills{display:flex;gap:4px;flex-wrap:wrap}
.filter-pill{padding:6px 12px;font-size:12px;font-weight:500;border:1px solid var(--border-2);border-radius:6px;background:var(--card);cursor:pointer;color:var(--muted);transition:all .15s}
.filter-pill:hover{border-color:var(--blue);color:var(--blue)}
.filter-pill.active{background:var(--internal);color:#fff;border-color:var(--internal)}

/* Year view */
.year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.year-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.year-grid{grid-template-columns:1fr}}
.month-card{background:var(--card);border-radius:10px;padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:all .15s;border:1px solid var(--border)}
.month-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.month-card h3{font-size:15px;margin-bottom:8px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px;text-align:center}
.mini-grid .d{padding:3px 0;border-radius:3px;color:var(--muted-2)}
.mini-grid .d.has{background:var(--blue);color:#fff;font-weight:600}
.mini-grid .d.today{outline:2px solid var(--amber);outline-offset:-1px}
.month-card .count{font-size:11px;color:var(--blue);font-weight:600;margin-top:8px}

/* Month grid */
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:10px;overflow:hidden;min-width:720px}
.cal-head{background:var(--card);padding:10px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.cal-day{background:var(--card);min-height:120px;padding:6px;position:relative}
.cal-day.empty{background:var(--bg);opacity:.4}
.cal-day .dn{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.cal-day .dn.today{color:var(--blue)}
.cal-day .add{font-size:11px;color:var(--blue);cursor:pointer;display:none;padding:2px}
.cal-day:hover .add{display:block}
.day-post{background:var(--bg);border-radius:5px;padding:4px 6px;margin-bottom:3px;font-size:10px;cursor:pointer;border-left:3px solid var(--border-2);transition:background .15s}
.day-post:hover{background:var(--blue-light)}
.day-post .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.day-post .t .fb{margin-left:auto;font-size:9px;font-weight:700;flex-shrink:0}
.day-post .fb.ok{color:var(--green)}.day-post .fb.ch{color:var(--amber)}.day-post .fb.un{color:var(--red)}
.day-post .plat-icons{margin-top:3px}
.day-post .plat-icon{width:14px;height:14px}
.day-post .plat-icon svg{width:10px;height:10px}

/* Review board (internal) */
.board-grid{display:grid;gap:14px;align-items:start}
.board-grid.sz-l{grid-template-columns:repeat(2,1fr)}
.board-grid.sz-m{grid-template-columns:repeat(3,1fr)}
.board-grid.sz-s{grid-template-columns:repeat(5,1fr)}
@media(max-width:1200px){.board-grid.sz-s{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.board-grid.sz-m,.board-grid.sz-s{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.board-grid,.board-grid.sz-l,.board-grid.sz-m,.board-grid.sz-s{grid-template-columns:1fr}}
.board-card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border);display:flex;flex-direction:column}
.board-card .media{width:100%;aspect-ratio:4/5;background:#0a0a0a;position:relative;cursor:pointer;overflow:hidden}
.board-card .media img,.board-card .media video{width:100%;height:100%;object-fit:cover}
.board-card .media .carousel{position:absolute;inset:0}
.board-card .media .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#666;font-size:12px;gap:4px;cursor:pointer;transition:background .15s}
.board-card .media .empty:hover{background:#1a1a1a;color:#fff}
.board-card .media .empty .plus{font-size:32px;line-height:1}
.board-card .media .plat-icons{position:absolute;top:8px;left:8px;z-index:3}
.board-card .media .plat-icon{background:rgba(255,255,255,.92);padding:3px}
.board-card .media .status-badge{position:absolute;top:8px;right:8px;z-index:3}
.board-card .media .fb-badge{position:absolute;bottom:8px;left:8px;z-index:3;font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;color:#fff}
.board-card .media .fb-badge.ok{background:var(--green)}.board-card .media .fb-badge.ch{background:var(--amber)}.board-card .media .fb-badge.un{background:var(--red)}
.board-card .media .upload-overlay{position:absolute;bottom:8px;right:8px;z-index:3;opacity:0;transition:opacity .15s}
.board-card .media:hover .upload-overlay{opacity:1}
.board-card .media .upload-overlay .btn{background:rgba(0,0,0,.75);color:#fff;border:none;font-size:10px;padding:4px 9px;backdrop-filter:blur(4px)}
.board-card .body{padding:12px 14px}
.board-card .body h4{font-size:14px;font-weight:700;margin-bottom:2px;line-height:1.2}
.board-card .body .date{font-size:11px;color:var(--muted);margin-bottom:8px}
.board-card .last-fb{font-size:11px;color:var(--muted);padding:8px 0;border-top:1px solid var(--border);margin-bottom:8px}
.board-card .last-fb strong{color:var(--text)}
.board-card .actions{display:flex;gap:5px;flex-wrap:wrap}
.board-card .actions .btn{flex:1;font-size:11px;padding:6px 8px;min-width:0}

/* Post editor sections */
.ed-section{margin-bottom:22px}
.ed-section-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-bottom:8px;border-bottom:2px solid var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ed-section-title .hint{font-family:'Inter',sans-serif;font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted-2)}

/* Client feedback panel in editor */
.fb-panel{border-radius:10px;padding:16px;margin-bottom:22px;border:2px solid var(--border)}
.fb-panel.st-approved{border-color:var(--green);background:var(--green-light)}
.fb-panel.st-changes{border-color:var(--amber);background:var(--amber-light)}
.fb-panel.st-pending{border-color:var(--border);background:var(--bg)}
.fb-panel.st-revised{border-color:var(--blue);background:var(--blue-light)}
.fb-panel .fb-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.fb-panel .fb-head h3{font-size:16px;flex:1}
.fb-panel .fb-empty{font-size:13px;color:var(--muted);font-style:italic}
.fb-panel .fb-done{display:flex;align-items:center;gap:6px;padding:10px 12px;background:#dcfce7;border-radius:7px;font-size:13px;color:#166534;font-weight:600;margin-top:10px}
.fb-resolve{font-size:11px;padding:3px 9px;border-radius:4px;border:1px solid var(--border-2);background:var(--card);cursor:pointer;white-space:nowrap}
.fb-resolve:hover{border-color:var(--green);color:var(--green)}
.fb-resolve.done{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.revision-bar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;margin-bottom:22px;flex-wrap:wrap}
.revision-bar.needs{background:var(--amber-light);border:2px solid var(--amber)}
.revision-bar.sent{background:var(--blue-light);border:2px solid var(--blue)}
.revision-bar .rb-text{flex:1;font-size:13px}
.revision-bar .rb-text strong{display:block;font-size:14px;margin-bottom:2px}

/* Creative thumbnails in editor */
.creative-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.creative-thumb{width:96px;height:96px;border-radius:7px;overflow:hidden;position:relative;border:2px solid var(--border);cursor:grab;background:#0a0a0a}
.creative-thumb:active{cursor:grabbing}
.creative-thumb.dragging{opacity:.4}
.creative-thumb.drag-over{border-color:var(--blue);border-style:solid;transform:scale(1.05)}
.creative-thumb img,.creative-thumb video{width:100%;height:100%;object-fit:cover}
.creative-thumb .num{position:absolute;bottom:3px;left:3px;width:26px;height:20px;border:1px solid rgba(255,255,255,.5);border-radius:3px;background:rgba(0,0,0,.75);color:#fff;font-size:10px;font-weight:700;text-align:center;padding:0;cursor:text;z-index:1}
.creative-thumb .num:focus{outline:none;border-color:var(--blue)}
.creative-thumb .num::-webkit-inner-spin-button{-webkit-appearance:none}
.creative-thumb .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.75);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;z-index:1}
.creative-thumb:hover .rm{display:flex}
.creative-thumb.uploading{display:flex;align-items:center;justify-content:center;background:var(--bg);border-color:var(--blue);color:var(--blue);font-size:10px;cursor:default}
.creative-add{width:96px;height:96px;border:2px dashed var(--border-2);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:11px;gap:2px;transition:all .15s}
.creative-add:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
.creative-add .plus{font-size:24px;line-height:1}
.creative-lang{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.creative-lang.en{color:var(--blue)}.creative-lang.ar{color:var(--red)}

/* Asset rows & script table */
.asset-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.asset-row input{flex:1;padding:7px 10px;border:1px solid var(--border-2);border-radius:6px;font-size:13px}
.asset-row input.lbl{flex:0 0 130px}
.script-table{width:100%;border-collapse:collapse;font-size:12px}
.script-table th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-bottom:2px solid var(--border)}
.script-table td{padding:3px 4px;border-bottom:1px solid var(--border)}
.script-table input{width:100%;border:1px solid transparent;background:transparent;font-size:12px;padding:5px 6px;border-radius:4px}
.script-table input:focus{outline:none;background:var(--blue-light);border-color:var(--blue)}

/* Editor layout with preview */
.ed-layout{display:grid;grid-template-columns:1fr 200px;gap:22px}
@media(max-width:800px){.ed-layout{grid-template-columns:1fr}}
.ed-preview{position:sticky;top:0;align-self:start}
.ed-preview .pv-box{width:100%;aspect-ratio:4/5;background:#0a0a0a;border-radius:12px;overflow:hidden;position:relative;border:3px solid #222}
.ed-preview .pv-box img,.ed-preview .pv-box video{width:100%;height:100%;object-fit:cover}
.ed-preview .pv-box .carousel{position:absolute;inset:0}
.ed-preview .pv-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;margin-bottom:6px;font-weight:600}
.ed-preview .pv-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:11px;text-align:center;padding:12px}

/* ============ CLIENT ============ */
.cl-header{background:var(--card);padding:0 24px;height:64px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--client);box-shadow:var(--shadow)}
.cl-header img{height:36px}
.cl-header .cl-badge{background:var(--client);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:5px 12px;border-radius:4px}
.cl-header h1{font-size:18px;font-weight:600;flex:1}
.cl-wrap{max-width:1300px;margin:0 auto;padding:24px}
.cl-hero{background:linear-gradient(135deg,var(--client),var(--purple));color:#fff;border-radius:14px;padding:28px 32px;margin-bottom:22px;box-shadow:0 6px 20px rgba(79,70,229,.25)}
.cl-hero h2{font-size:26px;margin-bottom:6px}
.cl-hero p{font-size:14px;opacity:.85;margin-bottom:16px;max-width:600px}
.cl-hero .steps{display:flex;gap:20px;flex-wrap:wrap;font-size:13px}
.cl-hero .steps div{display:flex;align-items:center;gap:8px}
.cl-hero .steps .n{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.cl-hero .stats{display:flex;gap:28px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.2);flex-wrap:wrap}
.cl-hero .stats div{text-align:left}
.cl-hero .stats strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;line-height:1}
.cl-hero .stats span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.8}
.cl-toolbar{background:var(--card);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:76px;z-index:50;border:1px solid var(--border)}
.cl-toolbar .left,.cl-toolbar .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cl-toolbar h2{font-size:22px}
.cl-toolbar .view-tabs button.active{background:var(--client)}
.cl-toolbar .filter-pill.active{background:var(--client);border-color:var(--client)}
.sizer{display:flex;border:1px solid var(--border-2);border-radius:7px;overflow:hidden}
.sizer button{background:var(--card);border:none;color:var(--muted);padding:7px 10px;cursor:pointer;transition:all .15s}
.sizer button.on{background:var(--client);color:#fff}
.sizer button svg{display:block}

/* Client calendar */
.cl-cal-day{min-height:84px;padding:8px;cursor:pointer;transition:background .15s}
.cl-cal-day:hover{background:var(--blue-light)}
.cl-cal-day .big{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;margin:2px 0 4px}
.cl-cal-day .dots{display:flex;gap:3px;flex-wrap:wrap}
.cl-cal-day .dots .dot{width:8px;height:8px;border-radius:50%}
.cl-cal-day .sub{font-size:9px;color:var(--muted);margin-top:3px}

/* Client review cards */
.cl-grid{display:grid;gap:14px;align-items:start}
.cl-grid.sz-l{grid-template-columns:repeat(2,1fr)}
.cl-grid.sz-m{grid-template-columns:repeat(4,1fr)}
.cl-grid.sz-s{grid-template-columns:repeat(6,1fr)}
@media(max-width:1200px){.cl-grid.sz-m{grid-template-columns:repeat(3,1fr)}.cl-grid.sz-s{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.cl-grid.sz-l,.cl-grid.sz-m,.cl-grid.sz-s{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.cl-grid.sz-l,.cl-grid.sz-m,.cl-grid.sz-s{grid-template-columns:1fr}}
.cl-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--border);display:flex;flex-direction:column;transition:all .2s}
.cl-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.cl-card .media{width:100%;aspect-ratio:4/5;background:#0a0a0a;position:relative;cursor:pointer;overflow:hidden}
.cl-card .media img,.cl-card .media video{width:100%;height:100%;object-fit:cover}
.cl-card .media .carousel{position:absolute;inset:0}
.cl-card .media .plat-icons{position:absolute;top:8px;left:8px;z-index:3}
.cl-card .media .plat-icon{background:rgba(255,255,255,.92);padding:3px}
.cl-card .media .revised-tag{position:absolute;top:8px;right:8px;z-index:3;background:var(--blue);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
.cl-card .media .no-media{display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:12px}
.cl-card .info{padding:12px 14px 8px}
.cl-card .info .date-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cl-card .info .date-chip{background:var(--client);color:#fff;border-radius:6px;padding:4px 8px;text-align:center;line-height:1;flex-shrink:0}
.cl-card .info .date-chip b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:16px}
.cl-card .info .date-chip span{font-size:8px;text-transform:uppercase;font-weight:600}
.cl-card .info h4{font-size:14px;font-weight:700;line-height:1.2;flex:1;min-width:0}
.cl-card .info .sub{font-size:10px;color:var(--muted)}
.cl-card .status-row{padding:8px 14px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--border)}
.cl-card .status-row .badge{flex:1;justify-content:center}
.cl-card .decide{padding:8px 14px;display:flex;gap:6px;border-top:1px solid var(--border)}
.cl-card .decide .btn{flex:1;font-size:12px;padding:8px 6px}
.cl-card .feedback{padding:8px 14px;border-top:1px solid var(--border)}
.cl-card .feedback .fb-row{display:flex;gap:5px}
.cl-card .feedback input.nm{flex:0 0 58px;padding:6px 7px;border:1px solid var(--border-2);border-radius:5px;font-size:11px}
.cl-card .feedback input.msg{flex:1;padding:6px 8px;border:1px solid var(--border-2);border-radius:5px;font-size:11px;min-width:0}
.cl-card .feedback input:focus{outline:none;border-color:var(--client)}
.cl-card .feedback .btn{padding:5px 9px;font-size:11px}
.cl-card .expand{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px;font-size:11px;font-weight:500;color:var(--client);background:var(--blue-light);cursor:pointer;border-top:1px solid var(--border);transition:background .15s}
.cl-card .expand:hover{background:#dbeafe}
.cl-card .expand .arrow{font-size:8px;transition:transform .2s;display:inline-block}
.cl-card.open .expand .arrow{transform:rotate(180deg)}
.cl-card .detail{max-height:0;overflow:hidden;transition:max-height .3s}
.cl-card.open .detail{max-height:1200px}
.cl-card .detail-inner{padding:12px 14px;border-top:1px solid var(--border)}
.cl-card .detail-inner .sec{margin-bottom:12px}
.cl-card .detail-inner .sec h5{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.cl-card .detail-inner .sec p{font-size:12px;line-height:1.5;white-space:pre-wrap}
.cl-card .detail-inner .ar-box{aspect-ratio:4/5;background:#0a0a0a;border-radius:8px;overflow:hidden;position:relative}
.cl-card .detail-inner .ar-box .carousel{position:absolute;inset:0}
.cl-card .comments-box{background:var(--bg);border-radius:8px;padding:10px}
.cl-footer{text-align:center;padding:40px 20px 20px;font-size:12px;color:var(--muted-2)}
.cl-footer img{height:22px;opacity:.35;display:block;margin:0 auto 6px}

/* Client PIN gate */
.cl-gate{max-width:420px;margin:60px auto;text-align:center;padding:0 20px}
.cl-gate .gate-card{background:var(--card);border-radius:16px;padding:40px 32px;box-shadow:var(--shadow-lg)}
.cl-gate h2{font-size:28px;margin-bottom:6px}
.cl-gate p{color:var(--muted);font-size:14px;margin-bottom:24px}
.cl-gate input{width:200px;text-align:center;font-size:24px;padding:14px;letter-spacing:10px;border:2px solid var(--border-2);border-radius:10px;margin-bottom:14px;font-weight:600}
.cl-gate input:focus{outline:none;border-color:var(--client);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
.cl-gate .err{color:var(--red);font-size:13px;margin-top:10px;min-height:20px}

/* Print */
@media print{.int-header,.cl-header,.int-cal-toolbar,.cl-toolbar,.month-nav,.btn{display:none!important}body{background:#fff}}

/* Responsive tweaks */
@media(max-width:600px){
  .int-header,.cl-header{padding:0 14px;height:56px}
  .int-header h1,.cl-header h1{font-size:14px}
  .int-header img,.cl-header img{height:30px}
  .int-wrap,.cl-wrap{padding:14px}
  .cl-hero{padding:20px}
  .cl-hero h2{font-size:22px}
  .cl-toolbar{top:66px;padding:10px 12px}
  .cl-toolbar h2{font-size:18px}
  .sizer{display:none}
  .cal-day{min-height:80px}
}
</style>
</head>

</div></div>

  }
  if (slides.length === 1) { const src = creativeUrl(calId, p.id, lang, slideKey(slides[0], 0), v, pin); return slides[0].type === 'video' ? `<video src="${src}" controls playsinline onclick="event.stopPropagation()"></video>` : `<img src="${src}" alt="">`; }
  if (p['hasCreative' + lang]) { const src = creativeUrl(calId, p.id, lang, undefined, v, pin); return p['creative' + lang + 'Type'] === 'video' ? `<video src="${src}" controls playsinline onclick="event.stopPropagation()"></video>` : `<img src="${src}" alt="">`; }
  return '';
}
const carState = {};
function carNav(id, d) { const t = $(id); if (!t) return; const n = t.children.length; carState[id] = (((carState[id] || 0) + d) % n + n) % n; carGo(id, carState[id]); }
function carGo(id, i) { const t = $(id); if (!t) return; carState[id] = i; t.style.transform = `translateX(-${i * 100}%)`; const d = $(id + '-dots'); if (d) d.querySelectorAll('.dot').forEach((x, j) => x.classList.toggle('active', j === i)); }

function openFullView(el, label) {
  if (event && (event.target.closest('.carousel-nav') || event.target.closest('.carousel-dots') || event.target.tagName === 'VIDEO')) return;
  const items = [...el.querySelectorAll('img,video')].filter(x => !x.closest('.plat-icon'));
  if (!items.length) return;
  let cur = 0;
  if (event) { const clicked = event.target.closest('.carousel-slide'); if (clicked) { const slides = [...el.querySelectorAll('.carousel-slide')]; cur = Math.max(0, slides.indexOf(clicked)); } }
  const ov = document.createElement('div'); ov.className = 'fullview'; ov.tabIndex = 0;
  const stage = document.createElement('div'); stage.className = 'fv-stage';
  ov.innerHTML = '<button class="fv-close">&times;</button>'; ov.appendChild(stage);
  if (label) { const l = document.createElement('div'); l.className = 'fv-label'; l.textContent = label; stage.appendChild(l); }
  function show(i) {
    cur = ((i % items.length) + items.length) % items.length;
    stage.querySelectorAll('.fvm').forEach(m => m.remove());
    const src = items[cur].src, vid = items[cur].tagName === 'VIDEO';
    const m = document.createElement(vid ? 'video' : 'img'); m.className = 'fvm'; m.src = src;
    if (vid) { m.controls = true; m.autoplay = true; m.onclick = e => e.stopPropagation(); }
    stage.appendChild(m);
    const c = stage.querySelector('.fv-counter'); if (c) c.textContent = (cur + 1) + ' / ' + items.length;
  }
  if (items.length > 1) {
    const prev = document.createElement('button'); prev.className = 'fv-nav prev'; prev.innerHTML = '&lsaquo;'; prev.onclick = e => { e.stopPropagation(); show(cur - 1); }; stage.appendChild(prev);
    const next = document.createElement('button'); next.className = 'fv-nav next'; next.innerHTML = '&rsaquo;'; next.onclick = e => { e.stopPropagation(); show(cur + 1); }; stage.appendChild(next);
    const cnt = document.createElement('div'); cnt.className = 'fv-counter'; stage.appendChild(cnt);
  }

  document.body.appendChild(ov); ov.focus(); show(cur);
}

function yearView(c) {

  let h = `<div class="int-cal-toolbar"><div class="left"><button class="month-nav" onclick="viewMonth=new Date(${y - 1},0,1);renderCalView()">&lsaquo;</button><h2 style="font-size:28px">${y}</h2><button class="month-nav" onclick="viewMonth=new Date(${y + 1},0,1);renderCalView()">&rsaquo;</button></div><div class="right"><button class="btn sm primary" onclick="addPost()">+ Add post</button></div></div>`;
  h += '<div class="year-grid">';
  for (let m = 0; m < 12; m++) {
    const dim = new Date(y, m + 1, 0).getDate(), fd = (new Date(y, m, 1).getDay() + 6) % 7;
    const mp = (c.posts || []).filter(p => inMonth(p, y, m)); const days = new Set(mp.map(p => +p.date.slice(8)));
    let g = '<div class="mini-grid">' + 'MTWTFSS'.split('').map(d => `<div style="font-weight:600;color:var(--muted-2)">${d}</div>`).join('');
    for (let i = 0; i < fd; i++) g += '<div class="d"></div>';
    for (let d = 1; d <= dim; d++) g += `<div class="d ${days.has(d) ? 'has' : ''} ${d === today.getDate() && m === today.getMonth() && y === today.getFullYear() ? 'today' : ''}">${d}</div>`;
    g += '</div>';
    h += `<div class="month-card" onclick="viewMonth=new Date(${y},${m},1);viewMode='month';renderCalView()"><h3>${MONTHS[m]}</h3>${g}${mp.length ? `<div class="count">${mp.length} post${mp.length !== 1 ? 's' : ''}</div>` : ''}</div>`;
  }
  return h + '</div>';
}

function monthView(c) {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth(), today = new Date();
  const dim = new Date(y, m + 1, 0).getDate(), fd = (new Date(y, m, 1).getDay() + 6) % 7;
  let h = calToolbar(c);
  h += '<div class="cal-scroll"><div class="cal-grid">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="cal-head">${d}</div>`).join('');
  for (let i = 0; i < fd; i++) h += '<div class="cal-day empty"></div>';
  for (let d = 1; d <= dim; d++) {
    const ds = monthKey(y, m) + '-' + String(d).padStart(2, '0');
    const dp = (c.posts || []).filter(p => p.date === ds);
    const isT = d === today.getDate() && m === today.getMonth() && y === today.getFullYear();
    h += `<div class="cal-day" ondragover="event.preventDefault()" ondrop="dropPost(event,'${ds}')"><div class="dn ${isT ? 'today' : ''}">${d}</div>`;
    dp.forEach(p => {
      const fb = getFb(c, p.id); const un = unresolved(fb);
      const ind = fb.status === 'approved' ? '<span class="fb ok">&#10003;</span>' : fb.status === 'declined' ? '<span class="fb ch">!</span>' : un ? `<span class="fb un">${un}</span>` : '';
      h += `<div class="day-post" draggable="true" ondragstart="dragPostStart(event,'${p.id}')" onclick="editPost('${p.id}')" style="border-left-color:${STATUS_COLOR[p.status] || '#d1d5db'}"><div class="t">${esc(p.topic || 'Untitled')}${ind}</div><div class="plat-icons">${platIcons(p.platforms)}</div></div>`;
    });
    h += `<div class="add" onclick="addPost('${ds}')">+ Add</div></div>`;
  }
  const rem = (7 - ((fd + dim) % 7)) % 7; for (let i = 0; i < rem; i++) h += '<div class="cal-day empty"></div>';
  return h + '</div></div>';
}
let dragPid = null;
function dragPostStart(e, id) { dragPid = id; e.dataTransfer.effectAllowed = 'move'; }
function dropPost(e, ds) { e.preventDefault(); if (!dragPid) return; const c = getCal(); const p = getPost(c, dragPid); if (p) { p.date = ds; saveCalendars(); renderCalView(); } dragPid = null; }

function boardView(c) {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  let mp = (c.posts || []).filter(p => inMonth(p, y, m)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (boardFilter !== 'all') mp = mp.filter(p => { const fb = getFb(c, p.id); if (boardFilter === 'unresolved') return unresolved(fb) > 0; if (boardFilter === 'changes') return fb.status === 'declined'; if (boardFilter === 'approved') return fb.status === 'approved'; if (boardFilter === 'pending') return !fb.status; return true; });
  const pills = `<div class="filter-pills">${['all', 'unresolved', 'changes', 'approved', 'pending'].map(f => `<button class="filter-pill ${boardFilter === f ? 'active' : ''}" onclick="boardFilter='${f}';renderCalView()">${f[0].toUpperCase() + f.slice(1)}</button>`).join('')}</div>`;
  const sizer = `<div class="sizer">${[['l', '<rect x="5" y="5" width="14" height="14" rx="2"/>'], ['m', '<rect x="4" y="5" width="7" height="14" rx="1.5"/><rect x="13" y="5" width="7" height="14" rx="1.5"/>'], ['s', '<rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/>']].map(([k, svg]) => `<button class="${boardSize === k ? 'on' : ''}" onclick="boardSize='${k}';renderCalView()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${svg}</svg></button>`).join('')}</div>`;
  let h = calToolbar(c, pills + sizer);
  if (!mp.length) return h + `<div style="text-align:center;padding:40px;color:var(--muted)">${boardFilter !== 'all' ? 'No posts match this filter.' : 'No posts this month.'}</div>`;
  h += `<div class="board-grid sz-${boardSize}">`;
  mp.forEach(p => {
    const fb = getFb(c, p.id); const un = unresolved(fb); const last = (fb.comments || []).slice(-1)[0];

    const fbBadge = fb.status === 'approved' ? '<div class="fb-badge ok">&#10003; Client approved</div>' : fb.status === 'declined' ? '<div class="fb-badge ch">! Changes requested</div>' : un ? `<div class="fb-badge un">${un} unresolved</div>` : '';
    h += `<div class="board-card">
      <div class="media" onclick="${media ? `openFullView(this,'${esc(p.topic || '')}')` : `$('bf-${p.id}').click()`}">${media || '<div class="empty"><span class="plus">+</span>Upload creative</div>'}<div class="plat-icons">${platIcons(p.platforms)}</div><span class="badge status-badge ${STATUS_CLASS[p.status] || 'draft'}">${esc(p.status || 'Draft')}</span>${fbBadge}${media ? `<div class="upload-overlay"><button class="btn" onclick="event.stopPropagation();$('bf-${p.id}').click()">+ Add</button></div>` : ''}</div>
      <input type="file" id="bf-${p.id}" accept="image/*,video/*" multiple style="display:none" onchange="boardUpload('${p.id}',this)">
      <div class="body"><h4>${esc(p.topic || 'Untitled')}</h4><div class="date">${fmtDate(p.date)} &middot; ${countCreatives(p)} creative${countCreatives(p) !== 1 ? 's' : ''}</div>
        ${last ? `<div class="last-fb"><strong>${esc(last.by || 'Client')}:</strong> ${esc((last.t || '').slice(0, 100))}${(last.t || '').length > 100 ? '…' : ''}</div>` : ''}
        <div class="actions"><button class="btn primary" onclick="editPost('${p.id}')">Open</button><select class="btn" style="flex:1.5" onchange="quickStatus('${p.id}',this.value)">${STATUSES.map(s => `<option ${s === p.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div></div>`;
  });
  return h + '</div>';

    </div>

      <div class="field"><label>English caption</label><textarea id="peCapEN" rows="5">${esc(p.captionEN || '')}</textarea></div>

function closeEditor() { $('postModal').classList.remove('show'); renderCalView(); }
function readForm(p) {

  if (v('peDate')) p.date = v('peDate');
  if (v('peStatus')) p.status = v('peStatus');
  if (v('peClickup') !== undefined) p.clickupLink = v('peClickup').trim();
  if (v('peType') !== undefined) p.creativeType = v('peType');
  if (v('peDim') !== undefined) p.dimensions = v('peDim');
  if (v('peBrief') !== undefined) p.brief = v('peBrief');
  if (v('peCapEN') !== undefined) p.captionEN = v('peCapEN');
  if (v('peCapAR') !== undefined) p.captionAR = v('peCapAR');
  if (v('peVisEN') !== undefined) p.visualCopyEN = v('peVisEN');
  if (v('peVisAR') !== undefined) p.visualCopyAR = v('peVisAR');
  if (v('peDir') !== undefined) p.creativeDirection = v('peDir');
  const plats = [...document.querySelectorAll('input[name=plat]:checked')].map(x => x.value); if (plats.length || $('peTopic')) p.platforms = plats;
  p.assets = []; document.querySelectorAll('[data-au]').forEach(inp => { const i = inp.dataset.au; const lbl = document.querySelector(`[data-al="${i}"]`); if (inp.value.trim()) p.assets.push({ label: lbl ? lbl.value.trim() : '', url: inp.value.trim() }); });
  p.videoScript = []; const rows = {}; document.querySelectorAll('[data-st]').forEach(inp => { const r = inp.dataset.st; rows[r] = rows[r] || {}; rows[r][inp.dataset.sf] = inp.value; }); Object.keys(rows).sort((a, b) => a - b).forEach(k => { const r = rows[k]; if (r.timecode || r.voiceEN || r.voiceAR || r.visuals) p.videoScript.push(r); });
}
function savePost(pid) { const c = getCal(); const p = getPost(c, pid); if (!p) return; readForm(p); saveCalendars(); closeEditor(); }
function deletePost(pid) { if (!confirm('Delete this post?')) return; const c = getCal(); c.posts = (c.posts || []).filter(p => p.id !== pid); saveCalendars(); closeEditor(); }
function addAssetRow() { const l = $('assetList'); const i = l.children.length; const r = document.createElement('div'); r.className = 'asset-row'; r.innerHTML = `<input class="lbl" placeholder="Label" data-al="${i}"><input placeholder="https://..." data-au="${i}"><button class="btn xs danger" onclick="this.parentElement.remove()">&times;</button>`; l.appendChild(r); }

function undoReapproval(pid) { const c = getCal(); const p = getPost(c, pid); if (!p) return; readForm(p); p.status = 'Changes Requested'; p.revisedAt = null; c.feedback[pid].status = 'declined'; saveCalendars(); editPost(pid); }

/* ----- Creative uploads & reordering ----- */
function uploadFile(pid, lang, file, done) {
  const isVid = file.type.startsWith('video/'); const max = isVid ? 24e6 : 8e6;
  if (file.size > max) { alert(`${isVid ? 'Video' : 'Image'} too large. Keep under ${isVid ? 24 : 8}MB.`); return; }
  const mime = file.type || (isVid ? 'video/mp4' : 'image/jpeg'); const key = 'carousel' + lang;
  uploadQueue = uploadQueue.then(async () => {
    const c = getCal(); const p = getPost(c, pid); if (!p) return;
    p[key] = p[key] || [];
    const kvIdx = p[key].length ? Math.max(...p[key].map(s => s.kvIdx || 0)) + 1 : 0;
    const grid = $('grid' + lang); let ph;
    if (grid) { ph = document.createElement('div'); ph.className = 'creative-thumb uploading'; ph.textContent = 'Uploading…'; grid.insertBefore(ph, grid.querySelector('.creative-add')); }
    try {
      const r = await fetch(`/api/creative-upload?calId=${encodeURIComponent(c.id)}&postId=${encodeURIComponent(pid)}&lang=${encodeURIComponent(lang + '-' + kvIdx)}&mime=${encodeURIComponent(mime)}`, { method: 'POST', body: file, headers: { 'content-type': mime } });
      const d = await r.json();
      if (d.ok) {
        p[key].push({ type: isVid ? 'video' : 'image', kvIdx });
        if (p[key].length === 1) { fetch(`/api/creative-upload?calId=${encodeURIComponent(c.id)}&postId=${encodeURIComponent(pid)}&lang=${lang}&mime=${encodeURIComponent(mime)}`, { method: 'POST', body: file, headers: { 'content-type': mime } }).catch(() => { }); p['hasCreative' + lang] = true; p['creative' + lang + 'Type'] = isVid ? 'video' : 'image'; }
        p.cv = (p.cv || 0) + 1;
        if ($('postModal').classList.contains('show')) readForm(p);
        await saveCalendars();
      }
    } catch (e) { console.error(e); }
    if (ph) ph.remove();
    done && done();
  });
}
function editorUpload(lang, input) { const pid = $('pmFoot').innerHTML.match(/deletePost\('([^']+)'/)[1]; const files = [...input.files]; input.value = ''; files.forEach(f => uploadFile(pid, lang, f, () => editPost(pid))); }
function curPid() { const m = $('pmFoot').innerHTML.match(/deletePost\('([^']+)'/); return m ? m[1] : null; }
function removeSlide(lang, i) { const pid = curPid(); const c = getCal(); const p = getPost(c, pid); readForm(p); p['carousel' + lang].splice(i, 1); p.cv = (p.cv || 0) + 1; if (!p['carousel' + lang].length) { p['hasCreative' + lang] = false; } saveCalendars(); editPost(pid); }
function reorderNum(lang, from, to) { const pid = curPid(); const c = getCal(); const p = getPost(c, pid); const arr = p['carousel' + lang]; to = Math.max(0, Math.min(to, arr.length - 1)); if (from === to) return; readForm(p); const [m] = arr.splice(from, 1); arr.splice(to, 0, m); p.cv = (p.cv || 0) + 1; saveCalendars(); editPost(pid); }
function dragStart(e, lang, i) { dragSlide = { lang, i }; e.dataTransfer.effectAllowed = 'move'; e.target.closest('.creative-thumb').classList.add('dragging'); }
function dropSlide(e, lang, to) { e.preventDefault(); e.target.closest('.creative-thumb')?.classList.remove('drag-over'); if (!dragSlide || dragSlide.lang !== lang) { dragSlide = null; return; } const from = dragSlide.i; dragSlide = null; if (from !== to) reorderNum(lang, from, to); }

/* ================================================================
   CLIENT: GATE
================================================================ */
function clientGate(id) {
  clientCalId = id;
  $('app').innerHTML = `<div class="cl-header"><img src="${LOGO}" alt="RICH"><span class="cl-badge">Client review</span><h1>Content Calendar</h1></div>
    <div class="cl-gate"><div class="gate-card"><h2>Enter your PIN</h2><p>This content calendar has been shared privately with you by RICH Marketing.</p><input id="pinIn" type="text" inputmode="numeric" autocomplete="off" placeholder="····" maxlength="10"><br><button class="btn primary" onclick="clientEnter()">View content</button><div class="err" id="pinErr"></div></div></div>`;
  $('pinIn').onkeydown = e => { if (e.key === 'Enter') clientEnter(); }; setTimeout(() => $('pinIn').focus(), 100);
}
async function clientEnter() {
  const pin = $('pinIn').value.trim(); $('pinErr').textContent = '';
  const d = await clientLoad(clientCalId, pin);
  if (d.error === 'pin') { $('pinErr').textContent = 'That PIN is not correct. Please try again.'; return; }
  if (d.error) { $('pinErr').textContent = 'Calendar not found.'; return; }
  clientPin = pin; clientData = d; try { clientSize = localStorage.getItem('rich_cl_sz') || 'm'; } catch (e) { } renderClient();
}

/* ================================================================
   CLIENT: REVIEW PORTAL
================================================================ */
function renderClient() {
  const c = clientData; const posts = (c.posts || []).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const dates = posts.map(p => p.date).filter(Boolean).sort();
  if (!clientMonth) { const now = new Date(); const nk = monthKey(now.getFullYear(), now.getMonth()); clientMonth = dates.some(d => d.startsWith(nk)) ? new Date(now.getFullYear(), now.getMonth(), 1) : dates.length ? new Date(dates[0] + 'T00:00:00') : new Date(); }
  const y = clientMonth.getFullYear(), m = clientMonth.getMonth();
  const allMonth = posts.filter(p => inMonth(p, y, m));
  let mp = allMonth;
  if (clientFilter !== 'all') mp = mp.filter(p => { const fb = p.feedback || {}; if (clientFilter === 'pending') return !fb.status; if (clientFilter === 'approved') return fb.status === 'approved'; if (clientFilter === 'changes') return fb.status === 'declined'; return true; });
  const months = [...new Set(dates.map(d => d.slice(0, 7)))].sort(); const mk = monthKey(y, m); const mi = months.indexOf(mk);
  const prevM = mi > 0 ? months[mi - 1] : null, nextM = mi < months.length - 1 ? months[mi + 1] : null;
  const approved = allMonth.filter(p => (p.feedback || {}).status === 'approved').length;
  const changes = allMonth.filter(p => (p.feedback || {}).status === 'declined').length;
  const pending = allMonth.length - approved - changes;
  const creatives = allMonth.reduce((s, p) => s + countCreatives(p), 0);
  let savedName = ''; try { savedName = localStorage.getItem('rich_cl_name') || ''; } catch (e) { }

  let h = `<div class="cl-header"><img src="${LOGO}" alt="RICH"><span class="cl-badge">Client review</span><h1>${esc(c.name)}</h1></div><div class="cl-wrap">`;
  h += `<div class="cl-hero"><h2>${esc(c.name)}</h2><p>${esc(c.intro || 'Please review the content below. Approve what works, or request changes and tell us what to adjust.')}</p>
    <div class="steps"><div><span class="n">1</span>Review each post</div><div><span class="n">2</span>Approve or request changes</div><div><span class="n">3</span>Leave specific feedback</div></div>
    <div class="stats"><div><strong>${allMonth.length}</strong><span>Posts</span></div><div><strong>${creatives}</strong><span>Creatives</span></div><div><strong style="color:#4ade80">${approved}</strong><span>Approved</span></div><div><strong style="color:#fbbf24">${pending}</strong><span>To review</span></div>${changes ? `<div><strong style="color:#fca5a5">${changes}</strong><span>Changes</span></div>` : ''}</div></div>`;
  h += `<div class="cl-toolbar"><div class="left">${prevM ? `<button class="month-nav" onclick="clientGo('${prevM}')">&lsaquo;</button>` : '<span style="width:34px"></span>'}<h2>${MONTHS[m]} ${y}</h2>${nextM ? `<button class="month-nav" onclick="clientGo('${nextM}')">&rsaquo;</button>` : '<span style="width:34px"></span>'}<div class="view-tabs"><button class="${clientTab === 'review' ? 'active' : ''}" onclick="clientTab='review';renderClient()">Review content</button><button class="${clientTab === 'calendar' ? 'active' : ''}" onclick="clientTab='calendar';renderClient()">Calendar</button></div></div>
    <div class="right"><div class="filter-pills">${[['all', 'All'], ['pending', 'To review'], ['approved', 'Approved'], ['changes', 'Changes']].map(([k, l]) => `<button class="filter-pill ${clientFilter === k ? 'active' : ''}" onclick="clientFilter='${k}';renderClient()">${l}</button>`).join('')}</div>
    <div class="sizer">${[['l', 'Large', '<rect x="5" y="5" width="14" height="14" rx="2"/>'], ['m', 'Medium', '<rect x="4" y="5" width="7" height="14" rx="1.5"/><rect x="13" y="5" width="7" height="14" rx="1.5"/>'], ['s', 'Small', '<rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/>']].map(([k, t, svg]) => `<button class="${clientSize === k ? 'on' : ''}" title="${t}" onclick="clientSize='${k}';localStorage.setItem('rich_cl_sz','${k}');renderClient()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${svg}</svg></button>`).join('')}</div></div></div>`;

  if (clientTab === 'calendar') {
    const dim = new Date(y, m + 1, 0).getDate(), fd = (new Date(y, m, 1).getDay() + 6) % 7, today = new Date();
    h += '<div class="cal-scroll"><div class="cal-grid">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="cal-head">${d}</div>`).join('');
    for (let i = 0; i < fd; i++) h += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= dim; d++) {
      const ds = mk + '-' + String(d).padStart(2, '0'); const dp = allMonth.filter(p => p.date === ds); const cr = dp.reduce((s, p) => s + countCreatives(p), 0);
      const isT = d === today.getDate() && m === today.getMonth() && y === today.getFullYear();
      h += `<div class="cal-day cl-cal-day" ${dp.length ? `onclick="clientTab='review';clientFilter='all';renderClient();setTimeout(()=>$('cp-${dp[0].id}')?.scrollIntoView({behavior:'smooth',block:'start'}),150)"` : ''}><div class="dn ${isT ? 'today' : ''}">${d}</div>${dp.length ? `<div class="big">${dp.length}</div><div class="dots">${dp.map(p => `<div class="dot" style="background:${PLAT_COLORS[(p.platforms || [])[0]] || '#8b5cf6'}" title="${esc(p.topic || '')}"></div>`).join('')}</div><div class="sub">${cr} creative${cr !== 1 ? 's' : ''}</div>` : ''}</div>`;
    }
    const rem = (7 - ((fd + dim) % 7)) % 7; for (let i = 0; i < rem; i++) h += '<div class="cal-day empty"></div>';
    h += '</div></div>';
  } else {
    if (!mp.length) h += `<div style="text-align:center;padding:50px;color:var(--muted)">${clientFilter !== 'all' ? 'Nothing matches this filter.' : 'No content planned for this month yet.'}</div>`;
    else {
      h += `<div class="cl-grid sz-${clientSize}">`;
      mp.forEach(p => {
        const fb = p.feedback || { status: '', comments: [] }; const d = new Date(p.date + 'T00:00:00');
        const media = mediaHTML(clientCalId, p, 'EN', p.cv, clientPin, { prefix: 'cl' }) || mediaHTML(clientCalId, p, 'AR', p.cv, clientPin, { prefix: 'cl' });
        const arMedia = (p.carouselEN || []).length && (p.carouselAR || []).length ? mediaHTML(clientCalId, p, 'AR', p.cv, clientPin, { prefix: 'clar' }) : '';
        const statusLabel = fb.status === 'approved' ? 'You approved this' : fb.status === 'declined' ? 'You requested changes' : CLIENT_STATUS_LABEL[p.status] || 'Awaiting your review';
        const statusCls = fb.status === 'approved' ? 'approved' : fb.status === 'declined' ? 'changes' : p.status === 'Revised' ? 'revised' : 'review';
        const comments = (fb.comments || []).map((cm, i) => `<div class="comment ${cm.resolved ? 'resolved' : ''}"><div class="comment-avatar client">${(cm.by || '?')[0].toUpperCase()}</div><div class="comment-body"><div class="comment-head"><strong>${esc(cm.by || 'You')}</strong>${cm.resolved ? '<span class="badge approved" style="font-size:9px">Actioned by RICH</span>' : ''}<time>${fmtTime(cm.d)}</time><div class="comment-actions"><button onclick="clEditComment('${p.id}',${i})">Edit</button><button class="del" onclick="clDeleteComment('${p.id}',${i})">Delete</button></div></div><div class="comment-text">${esc(cm.t)}</div></div></div>`).join('');
        h += `<div class="cl-card" id="cp-${p.id}">
          <div class="media" onclick="openFullView(this,'${esc(p.topic || '')}')">${media || '<div class="no-media">Creative coming soon</div>'}<div class="plat-icons">${platIcons(p.platforms)}</div>${p.status === 'Revised' ? '<div class="revised-tag">Revised</div>' : ''}</div>
          <div class="info"><div class="date-row"><div class="date-chip"><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-GB', { month: 'short' })}</span></div><div style="min-width:0"><h4>${esc(p.topic || 'Untitled')}</h4><div class="sub">${d.toLocaleDateString('en-GB', { weekday: 'long' })}${p.creativeType ? ' · ' + esc(p.creativeType) : ''} · ${countCreatives(p)} creative${countCreatives(p) !== 1 ? 's' : ''}</div></div></div></div>
          <div class="status-row"><span class="badge ${statusCls}">${statusLabel}</span></div>
          <div class="decide"><button class="btn outline-green ${fb.status === 'approved' ? 'active' : ''}" onclick="clDecide('${p.id}','approved')">&#10003; Approve</button><button class="btn outline-amber ${fb.status === 'declined' ? 'active' : ''}" onclick="clDecide('${p.id}','declined')">Request changes</button></div>
          <div class="feedback"><div class="fb-row"><input class="nm" id="nm-${p.id}" value="${esc(savedName)}" placeholder="Name" onchange="localStorage.setItem('rich_cl_name',this.value)"><input class="msg" id="msg-${p.id}" placeholder="What should we change?" onkeydown="if(event.key==='Enter')clComment('${p.id}')"><button class="btn primary" onclick="clComment('${p.id}')">Send</button></div></div>
          <div class="expand" onclick="this.closest('.cl-card').classList.toggle('open')"><span class="arrow">&#9660;</span>${(fb.comments || []).length ? `${fb.comments.length} comment${fb.comments.length !== 1 ? 's' : ''} &amp; details` : 'Captions &amp; details'}</div>
          <div class="detail"><div class="detail-inner">
            ${p.captionEN ? `<div class="sec"><h5>Caption (English)</h5><p>${esc(p.captionEN)}</p></div>` : ''}
            ${p.captionAR ? `<div class="sec"><h5>Caption (Arabic)</h5><p dir="rtl">${esc(p.captionAR)}</p></div>` : ''}
            ${arMedia ? `<div class="sec"><h5>Arabic creative</h5><div class="ar-box" onclick="openFullView(this,'Arabic')">${arMedia}</div></div>` : ''}
            ${(p.assets || []).filter(a => a.url).length ? `<div class="sec"><h5>Files</h5>${p.assets.filter(a => a.url).map(a => `<a href="${esc(a.url)}" target="_blank" class="btn xs" style="margin:2px">${esc(a.label || 'Open file')}</a>`).join('')}</div>` : ''}
            <div class="sec"><h5>Your feedback</h5><div class="comments-box">${comments || '<div style="font-size:12px;color:var(--muted-2);font-style:italic">No comments yet.</div>'}</div></div>
          </div></div>
        </div>`;
      });
      h += '</div>';
    }
  }
  h += `<div class="cl-footer"><img src="${LOGO}" alt="RICH">Prepared by RICH Marketing</div></div>`;
  $('app').innerHTML = h;
}
function clientGo(k) { const [y, m] = k.split('-').map(Number); clientMonth = new Date(y, m - 1, 1); renderClient(); }
async function clDecide(pid, s) { const p = clientData.posts.find(x => x.id === pid); p.feedback = p.feedback || { status: '', comments: [] }; p.feedback.status = p.feedback.status === s ? '' : s; renderClient(); await clientSend(pid, { status: p.feedback.status }); }
async function clComment(pid) { const name = $('nm-' + pid).value.trim() || 'Client', t = $('msg-' + pid).value.trim(); if (!t) return; localStorage.setItem('rich_cl_name', name); const p = clientData.posts.find(x => x.id === pid); p.feedback = p.feedback || { status: '', comments: [] }; p.feedback.comments.push({ t, by: name, d: new Date().toISOString() }); renderClient(); await clientSend(pid, { comment: t, by: name }); }
async function clEditComment(pid, i) { const p = clientData.posts.find(x => x.id === pid); const cm = p.feedback.comments[i]; const t = prompt('Edit your comment:', cm.t); if (t === null) return; if (t.trim()) cm.t = t.trim(); else p.feedback.comments.splice(i, 1); renderClient(); await clientSend(pid, { replaceComments: p.feedback.comments }); }
async function clDeleteComment(pid, i) { if (!confirm('Delete this comment?')) return; const p = clientData.posts.find(x => x.id === pid); p.feedback.comments.splice(i, 1); renderClient(); await clientSend(pid, { replaceComments: p.feedback.comments }); }

init();
</script>
