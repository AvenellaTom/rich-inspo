<style>
  :root{
    --bg:#0b0b0b;--surface:#141414;--surface-2:#1b1b1b;
    --border:#262626;--border-2:#383838;
    --blue:#0083BE;--blue-2:#00A6E0;--blue-soft:rgba(0,131,190,.14);--coral:#FF6A3D;
    --grad:linear-gradient(135deg,#00A6E0 0%,#0072B0 100%);
    --text:#f4f4f4;--muted:#9a9a9a;--muted-2:#6f6f6f;
  }
  *{box-sizing:border-box}
  html,body{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
  h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
  a{color:var(--blue)}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1280px;margin:0 auto;padding:0 18px;width:100%}

  header{border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,11,11,.94);backdrop-filter:blur(10px);z-index:20}
  .head-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;max-width:1280px;margin:0 auto}
  .logo{height:26px;width:auto;display:block}
  .head-right{display:flex;align-items:center;gap:8px}
  .icon-btn{background:none;border:1px solid var(--border-2);color:var(--text);border-radius:9px;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{border-color:var(--blue)}
  .btn{background:var(--grad);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:0 4px 16px rgba(0,131,190,.32)}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;border:1px solid var(--border-2);color:var(--text);box-shadow:none}
  .btn.ghost:hover{border-color:var(--blue)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn.wide{width:100%;padding:15px;font-size:15px}

  .hero{padding:40px 18px 20px;max-width:720px;margin:0 auto;width:100%}
  .hero h1{font-size:30px;text-transform:uppercase;font-weight:700;margin:0 0 20px;display:flex;align-items:center;justify-content:center;gap:12px}
  .hero h1 svg{flex:none}

  /* PRIMARY: add a link */
  .addwrap{position:relative}
  .addwrap .plus{position:absolute;left:18px;top:22px;color:var(--blue-2);font-size:20px;font-weight:700;line-height:1}
  #urlInput{width:100%;background:var(--surface);border:1.5px solid var(--blue);color:var(--text);border-radius:14px;padding:18px 18px 18px 46px;font-size:17px;font-family:inherit;box-shadow:0 6px 26px rgba(0,131,190,.20)}
  #urlInput::placeholder{color:var(--muted)}
  #urlInput:focus{outline:none;box-shadow:0 0 0 4px var(--blue-soft),0 6px 26px rgba(0,131,190,.25)}

  .addpanel{display:none;margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .addpanel.show{display:block}
  .prev{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--surface-2);min-height:120px;display:flex;align-items:center;justify-content:center;position:relative}
  .prev img{width:100%;display:block;max-height:320px;object-fit:contain;background:#000}
  .prev .plabel{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;font-size:16px;color:var(--muted-2);padding:26px;text-align:center}
  .detected{margin:12px 0 2px;font-size:13px;color:var(--muted)}
  .detected b{color:var(--text)}
  .fld{margin-top:14px}
  .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px;font-weight:600}
  input[type=text],input[type=url],textarea,select.full{width:100%;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);border-radius:10px;padding:12px 13px;font-family:inherit;font-size:15px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  textarea{resize:vertical;min-height:56px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row2{grid-template-columns:1fr}}
  .more-toggle{background:none;border:none;color:var(--blue);font-size:13px;padding:14px 0 0;font-weight:600}
  .more{display:none}.more.show{display:block}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--surface-2);border:1px solid var(--border-2);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px}
  .chip.on{background:var(--blue-soft);border-color:var(--blue);color:#fff}
  .cover-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cover-row input{flex:1;min-width:150px}
  .file-lbl{display:inline-block;border:1px solid var(--border-2);color:var(--text);border-radius:10px;padding:11px 14px;font-size:13px}
  .file-lbl:hover{border-color:var(--blue)}
  #coverFile{display:none}
  .save-row{display:flex;gap:10px;margin-top:18px}

  /* SECONDARY: search sits inline with the filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:24px auto 0;max-width:840px}
  .searchbox{position:relative;flex:1;min-width:170px;max-width:320px}
  .searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45;width:16px;height:16px}
  #search{width:100%;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);border-radius:9px;padding:9px 12px 9px 34px;font-size:13px;font-family:inherit}
  #search:focus{outline:none;border-color:var(--blue-2)}
  select{background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13px;max-width:100%}
  .sizer{display:flex;border:1px solid var(--border-2);border-radius:9px;overflow:hidden}
  .sizer button{background:var(--surface-2);border:none;color:var(--muted);padding:9px 11px;font-size:13px}
  .sizer button.on{background:var(--grad);color:#fff}
  .count{color:var(--muted-2);font-size:13px;margin-top:12px;text-align:center}
  .count b{color:var(--text)}

  main{flex:1}
  .grid{display:grid;gap:14px;padding:14px 0 50px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .grid.s{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
  .grid.l{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-2px);border-color:var(--border-2)}
  .thumb{position:relative;aspect-ratio:4/5;background:var(--surface-2);cursor:pointer;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted-2);gap:6px;text-align:center;padding:12px}
  .thumb .ph .plabel{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;font-size:20px;color:var(--muted)}
  .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);opacity:0;transition:opacity .15s}
  .thumb:hover .play{opacity:1}
  .thumb .play span{background:var(--grad);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,131,190,.4)}
  .pill{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.66);border:1px solid var(--border-2);color:#fff;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;backdrop-filter:blur(4px)}
  .body{padding:11px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
  .client{font-family:'Barlow Condensed';font-weight:600;text-transform:uppercase;font-size:15px;letter-spacing:.03em;color:var(--blue);line-height:1.15}
  .note{font-size:13px;color:var(--text);line-height:1.4}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
  .tag{background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-size:10px;padding:2px 7px;border-radius:6px}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted-2);border-top:1px solid var(--border);padding:8px 12px;gap:8px}
  .meta .acts{display:flex;gap:11px}
  .meta button{background:none;border:none;color:var(--muted-2);font-size:12px;padding:0}
  .meta button:hover{color:var(--coral)}
  .used-btn.on{color:var(--coral)}
  /* small tiles: stop the squash */
  .grid.s .note{display:none}
  .grid.s .tags{display:none}
  .grid.s .client{font-size:13px}
  .grid.s .meta{flex-direction:column;align-items:flex-start;gap:6px}
  .empty{grid-column:1/-1;text-align:center;padding:56px 18px;color:var(--muted)}
  .empty .display{font-size:24px;text-transform:uppercase;color:var(--text);margin-bottom:8px}

  footer{border-top:1px solid var(--border);padding:20px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted-2);font-size:12px;letter-spacing:.03em}
  footer img{height:14px;opacity:.75}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:20px 16px;overflow:auto}
  .modal.show{display:flex}
  .modal-inner{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:460px;width:100%;padding:16px;margin:auto}
  .modal-inner h3{margin:0 0 14px;font-size:22px;text-transform:uppercase}
  .modal-inner .close{float:right;background:none;border:none;color:var(--muted);font-size:26px;line-height:1;margin-top:-4px}
  .mrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
  .mrow span{flex:1}.mrow button{background:none;border:none;color:var(--muted-2);font-size:12px}.mrow button:hover{color:var(--blue)}
  .madd{display:flex;gap:8px;margin-top:12px}
  .mcol h4{font-family:'Barlow Condensed';text-transform:uppercase;font-size:15px;color:var(--muted);margin:18px 0 4px}

  @media(max-width:560px){
    .hero{padding:24px 16px 14px}.hero h1{font-size:23px;margin-bottom:16px}
    #urlInput{font-size:16px;padding:15px 15px 15px 44px}
    .wrap{padding:0 14px}
    .modal{padding:0;align-items:stretch}
    .modal-inner{border-radius:16px 16px 0 0;margin:auto 0 0;max-width:none}
  }
</style>
</head>

const memMap={};
const local={
  async get(k,fb){try{if(window.storage){const r=await window.storage.get(k);return r?JSON.parse(r.value):fb;}}catch(e){}return (k in memMap)?memMap[k]:fb;},
  async set(k,v){memMap[k]=v;try{if(window.storage)await window.storage.set(k,JSON.stringify(v));}catch(e){}}
};
const K={items:'rich_items',clients:'rich_clients',cats:'rich_cats',size:'rich_size'};
const api={on:false};
async function loadData(){
  try{const r=await fetch('/api/data');if(r.ok){const d=await r.json();api.on=true;
    return {items:d.items||[],clients:(d.clients&&d.clients.length)?d.clients:DEFAULT_CLIENTS,cats:(d.cats&&d.cats.length)?d.cats:DEFAULT_CATS};}}catch(e){}
  return {items:await local.get(K.items,[]),clients:await local.get(K.clients,DEFAULT_CLIENTS),cats:await local.get(K.cats,DEFAULT_CATS)};
}
async function saveItems(){ if(api.on){await fetch('/api/items',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(items)});} else {await local.set(K.items,items);} }
async function saveLists(){ if(api.on){await fetch('/api/lists',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({clients,cats})});} else {await local.set(K.clients,clients);await local.set(K.cats,cats);} }
async function fetchPreview(url){ if(!api.on)return''; try{const r=await fetch('/api/preview?url='+encodeURIComponent(url));if(r.ok){const j=await r.json();return j.image||'';}}catch(e){} return''; }

function parseSource(url){url=(url||'').trim();let m;
  if((m=url.match(/instagram\.com\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/i))){const k=m[1].toLowerCase();const path=k==='tv'?'tv':(k.startsWith('reel')?'reel':'p');
    return {platform:'Instagram',embedId:`https://www.instagram.com/${path}/${m[2]}/`,shortcode:m[2],url,mtype:k.startsWith('reel')?'Reel':k==='tv'?'Video':'Still'};}
  if((m=url.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/i))) return {platform:'TikTok',embedId:m[1],url,mtype:'Reel'};
  if(/tiktok\.com/i.test(url)) return {platform:'TikTok',embedId:null,url,mtype:'Reel'};
  if((m=url.match(/(?:youtube\.com\/shorts\/|youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/i)))
    return {platform:'YouTube',embedId:m[1],url,short:/shorts/i.test(url),mtype:/shorts/i.test(url)?'Short':'Video'};
  if((m=url.match(/vimeo\.com\/(?:video\/)?(\d+)/i))) return {platform:'Vimeo',embedId:m[1],url,mtype:'Video'};
  if(/^https?:\/\//i.test(url)) return {platform:'Other',embedId:null,url,mtype:'Other'};
  return null;}
function autoCover(it){ if(it.platform==='YouTube'&&it.embedId) return `https://img.youtube.com/vi/${it.embedId}/hqdefault.jpg`; return ''; }
function bestCover(it){ return it.cover || autoCover(it) || ''; }

const $=id=>document.getElementById(id);
const clientSel=$('clientSel'),typeSel=$('typeSel'),noteInput=$('noteInput'),byInput=$('byInput'),urlInput=$('urlInput'),coverUrl=$('coverUrl'),catChips=$('catChips');
MTYPES.forEach(t=>typeSel.add(new Option(t,t)));
let clients=[],cats=[],items=[],tileSize='m',editingId=null,staged=null,stagedCats=new Set(),stagedCover='';

/* ---------- Add / edit (inline in hero) ---------- */
$('addTop').onclick=()=>{urlInput.focus();window.scrollTo({top:0,behavior:'smooth'});};
$('cancelBtn').onclick=resetForm;
$('moreToggle').onclick=()=>{const m=$('more');m.classList.toggle('show');$('moreToggle').textContent=m.classList.contains('show')?'Hide extra options':'Add categories, type or a cover';};
let dbp;urlInput.addEventListener('input',()=>{clearTimeout(dbp);dbp=setTimeout(autoPreview,300);});
async function autoPreview(){
  const p=parseSource(urlInput.value);
  if(!p){$('addPanel').classList.remove('show');staged=null;return;}
  staged=p;typeSel.value=p.mtype;editingId=editingId; // keep edit context if any
  $('detected').innerHTML=`Detected type: <b>${p.mtype}</b>`;
  $('addPanel').classList.add('show');
  if(!stagedCover) stagedCover=autoCover(p);
  renderPreview();
  if(!stagedCover){renderPreview(true);const og=await fetchPreview(p.url);if(staged&&staged.url===p.url&&og){stagedCover=og;coverUrl.value=(og.indexOf('data:')!==0?og:'');renderPreview();}else{renderPreview();}}
}
function renderPreview(loading){const box=$('prevBox');
  if(stagedCover){box.innerHTML=`<img src="${stagedCover}" alt="" onerror="this.parentNode.innerHTML='<div class=&quot;plabel&quot;>No preview available, it still saves fine</div>'">`;return;}
  box.innerHTML=`<div class="plabel">${loading?'Finding preview...':(staged?'No preview available, it still saves fine':'Preview appears here')}</div>`;}
coverUrl.addEventListener('input',e=>{stagedCover=e.target.value.trim();renderPreview();});
$('coverFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{const img=new Image();img.onload=()=>{const max=560,sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    stagedCover=c.toDataURL('image/jpeg',0.72);coverUrl.value='';renderPreview();};img.src=ev.target.result;};r.readAsDataURL(f);});

$('saveBtn').onclick=async()=>{
  if(!staged){alert('Paste a link first.');return;}
  const btn=$('saveBtn');btn.textContent='Saving...';btn.disabled=true;
  const data={platform:staged.platform,embedId:staged.embedId,shortcode:staged.shortcode||'',url:staged.url,short:!!staged.short,
    client:clientSel.value,mtype:typeSel.value,categories:[...stagedCats],note:noteInput.value.trim(),cover:stagedCover,by:byInput.value.trim()||'Team'};
  if(editingId){Object.assign(items.find(x=>x.id===editingId),data);}
  else{items.unshift({id:Date.now().toString(36),...data,used:false,created:new Date().toISOString()});}
  await saveItems();btn.textContent='Save to library';btn.disabled=false;resetForm();render();
};
function resetForm(){staged=null;editingId=null;stagedCats.clear();stagedCover='';
  urlInput.value='';noteInput.value='';coverUrl.value='';byInput.value='';typeSel.value='Reel';clientSel.value=PROTECTED_CLIENT;
  $('addPanel').classList.remove('show');$('detected').innerHTML='';$('saveBtn').textContent='Save to library';
  $('prevBox').innerHTML='<div class="plabel">Preview appears here</div>';
  $('more').classList.remove('show');$('moreToggle').textContent='Add categories, type or a cover';
  [...catChips.children].forEach(c=>c.classList.remove('on'));}

function editItem(id){const it=items.find(x=>x.id===id);if(!it)return;
  editingId=id;staged={platform:it.platform,embedId:it.embedId,shortcode:it.shortcode,url:it.url,short:it.short,mtype:it.mtype};stagedCover=it.cover||'';
  urlInput.value=it.url;clientSel.value=it.client;typeSel.value=it.mtype||'Reel';noteInput.value=it.note||'';byInput.value=it.by||'';
  coverUrl.value=(it.cover&&it.cover.indexOf('data:')!==0)?it.cover:'';
  stagedCats=new Set(it.categories||[]);[...catChips.children].forEach(c=>c.classList.toggle('on',stagedCats.has(c.textContent)));
  $('detected').innerHTML=`Detected type: <b>${it.mtype}</b>`;$('saveBtn').textContent='Update idea';
  $('addPanel').classList.add('show');$('more').classList.add('show');$('moreToggle').textContent='Hide extra options';
  renderPreview();window.scrollTo({top:0,behavior:'smooth'});}

/* ---------- Lists ---------- */
function buildClientUI(){clientSel.innerHTML='';clients.forEach(c=>clientSel.add(new Option(c,c)));clientSel.value=PROTECTED_CLIENT;
  const fc=$('fClient');const cur=fc.value;fc.innerHTML='';fc.add(new Option('Any client',''));clients.forEach(c=>fc.add(new Option(c,c)));fc.value=cur;}
function buildCatUI(){catChips.innerHTML='';cats.forEach(c=>{const el=document.createElement('button');el.type='button';el.className='chip';el.textContent=c;
    el.onclick=()=>{el.classList.toggle('on');el.classList.contains('on')?stagedCats.add(c):stagedCats.delete(c);};catChips.appendChild(el);});
  const fc=$('fCat');const cur=fc.value;fc.innerHTML='';fc.add(new Option('Any category',''));cats.forEach(c=>fc.add(new Option(c,c)));fc.value=cur;}
function buildTypeFilter(){const ft=$('fType');ft.innerHTML='';ft.add(new Option('Any type',''));MTYPES.forEach(t=>ft.add(new Option(t,t)));}
$('manageBtn').onclick=()=>{renderManage();$('manage').classList.add('show');};
$('manageClose').onclick=()=>$('manage').classList.remove('show');
function renderManage(){const cr=$('clientRows');cr.innerHTML='';
  clients.forEach(c=>{const row=document.createElement('div');row.className='mrow';row.innerHTML=`<span>${c}</span>`;
    if(c!==PROTECTED_CLIENT){const r=document.createElement('button');r.textContent='Rename';r.onclick=()=>renameClient(c);const x=document.createElement('button');x.textContent='Remove';x.onclick=()=>removeClient(c);row.appendChild(r);row.appendChild(x);}
    else{const t=document.createElement('span');t.style.cssText='flex:0;color:var(--muted-2);font-size:11px';t.textContent='default';row.appendChild(t);}cr.appendChild(row);});
  const kr=$('catRows');kr.innerHTML='';
  cats.forEach(c=>{const row=document.createElement('div');row.className='mrow';row.innerHTML=`<span>${c}</span>`;const r=document.createElement('button');r.textContent='Rename';r.onclick=()=>renameCat(c);const x=document.createElement('button');x.textContent='Remove';x.onclick=()=>removeCat(c);row.appendChild(r);row.appendChild(x);kr.appendChild(row);});}
$('addClientBtn').onclick=async()=>{const v=$('newClient').value.trim();if(!v||clients.includes(v))return;clients.push(v);await saveLists();$('newClient').value='';buildClientUI();renderManage();};
$('addCatBtn').onclick=async()=>{const v=$('newCat').value.trim();if(!v||cats.includes(v))return;cats.push(v);await saveLists();$('newCat').value='';buildCatUI();renderManage();};
async function renameClient(o){const v=prompt('Rename client',o);if(!v||v===o)return;clients=clients.map(c=>c===o?v:c);items.forEach(i=>{if(i.client===o)i.client=v;});await saveLists();await saveItems();buildClientUI();renderManage();render();}
async function removeClient(c){const n=items.filter(i=>i.client===c).length;if(!confirm(`Remove "${c}"?`+(n?` ${n} idea(s) move to ${PROTECTED_CLIENT}.`:'')))return;clients=clients.filter(x=>x!==c);items.forEach(i=>{if(i.client===c)i.client=PROTECTED_CLIENT;});await saveLists();await saveItems();buildClientUI();renderManage();render();}
async function renameCat(o){const v=prompt('Rename category',o);if(!v||v===o)return;cats=cats.map(c=>c===o?v:c);items.forEach(i=>{i.categories=(i.categories||[]).map(x=>x===o?v:x);});await saveLists();await saveItems();buildCatUI();renderManage();render();}
async function removeCat(c){if(!confirm(`Remove category "${c}"? It will be stripped from any ideas using it.`))return;cats=cats.filter(x=>x!==c);items.forEach(i=>{i.categories=(i.categories||[]).filter(x=>x!==c);});await saveLists();await saveItems();buildCatUI();renderManage();render();}

/* ---------- Size + filters ---------- */
$('sizer').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;tileSize=b.dataset.size;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));await local.set(K.size,tileSize);applySize();});
function applySize(){const g=$('grid');g.classList.remove('s','l');if(tileSize==='s')g.classList.add('s');if(tileSize==='l')g.classList.add('l');}
let deb;$('search').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(render,220);});
['fClient','fCat','fType','fUsed'].forEach(id=>$(id).addEventListener('change',render));

/* ---------- Smarter search ---------- */
function queryGroups(q){return q.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).map(w=>{const s=new Set([w]);(SYN[w]||[]).forEach(x=>s.add(x));if(w.length>3&&w.endsWith('s'))s.add(w.slice(0,-1));return[...s];});}

/* ---------- Render ---------- */
function render(){
  const q=$('search').value,fc=$('fClient').value,fcat=$('fCat').value,ftp=$('fType').value,fu=$('fUsed').value;
  const groups=queryGroups(q);
  const base=items.filter(it=>{
    if(fc&&it.client!==fc)return false;if(fcat&&!(it.categories||[]).includes(fcat))return false;
    if(ftp&&it.mtype!==ftp)return false;if(fu==='yes'&&!it.used)return false;if(fu==='no'&&it.used)return false;
    return true;});
  let list=base,loose=false;
  if(groups.length){
    list=base.filter(it=>{const hay=(it.note+' '+it.url+' '+it.client+' '+(it.categories||[]).join(' ')+' '+it.mtype+' '+it.platform+' '+(it.by||'')).toLowerCase();
      return groups.every(g=>g.some(t=>hay.includes(t)));});
    if(list.length===0){list=base;loose=true;}
  }
  $('count').innerHTML= loose ? `No exact match, showing all <b>${list.length}</b>` : `<b>${list.length}</b> of ${items.length} ideas`;
  const grid=$('grid');
  if(!list.length){grid.innerHTML=`<div class="empty"><div class="display">${items.length?'No matches':'Your library is empty'}</div><div>${items.length?'Try a broader word or clear a filter.':'Paste a link above to save your first idea.'}</div></div>`;return;}
  grid.innerHTML=list.map(it=>{const cover=bestCover(it);
    const thumb=cover?`<img alt="" src="${cover}" onerror="this.style.display='none';this.parentNode.querySelector('.ph').style.display='flex'">`:'';
    const ph=`<div class="ph" style="display:${cover?'none':'flex'}"><div class="plabel">${it.client&&it.client!==PROTECTED_CLIENT?it.client:'Idea'}</div><div style="font-size:12px">tap to play</div></div>`;
    const cats=(it.categories||[]).map(c=>`<span class="tag">${c}</span>`).join('');
    const date=new Date(it.created).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    return `<div class="card"><div class="thumb" onclick="play('${it.id}')">${it.mtype?`<span class="pill">${it.mtype}</span>`:''}${thumb}${ph}<div class="play"><span>Play</span></div></div>
      <div class="body"><div class="client">${it.client}</div>${it.note?`<div class="note">${it.note}</div>`:''}${cats?`<div class="tags">${cats}</div>`:''}</div>
      <div class="meta"><span>${it.by||'Team'} &middot; ${date}</span><span class="acts">
        <button class="used-btn ${it.used?'on':''}" onclick="event.stopPropagation();toggleUsed('${it.id}')">${it.used?'Used':'Mark used'}</button>
        <button onclick="event.stopPropagation();editItem('${it.id}')">Edit</button>
        <button onclick="event.stopPropagation();removeItem('${it.id}')">Remove</button></span></div></div>`;}).join('');
}
async function toggleUsed(id){const it=items.find(x=>x.id===id);if(it){it.used=!it.used;await saveItems();render();}}
async function removeItem(id){if(!confirm('Remove this idea?'))return;items=items.filter(x=>x.id!==id);await saveItems();render();}

/* ---------- Player (self-contained iframes, no external scripts) ---------- */
function play(id){const it=items.find(x=>x.id===id);if(!it)return;const body=$('modalBody');
  if(it.platform==='Instagram'){const sc=it.shortcode||'';const src=sc?`https://www.instagram.com/p/${sc}/embed`:it.url;body.innerHTML=`<iframe src="${src}" style="width:100%;height:600px;border:0;border-radius:10px" allowtransparency="true" scrolling="no"></iframe>`;openM();}
  else if(it.platform==='YouTube'){body.innerHTML=`<div style="position:relative;padding-top:${it.short?'177%':'56.25%'}"><iframe src="https://www.youtube.com/embed/${it.embedId}?autoplay=1" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>`;openM();}
  else if(it.platform==='Vimeo'){body.innerHTML=`<div style="position:relative;padding-top:56.25%"><iframe src="https://player.vimeo.com/video/${it.embedId}?autoplay=1" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay;fullscreen" allowfullscreen></iframe></div>`;openM();}
  else if(it.platform==='TikTok'&&it.embedId){body.innerHTML=`<iframe src="https://www.tiktok.com/embed/v2/${it.embedId}" style="width:100%;height:740px;border:0;border-radius:10px" allow="autoplay" scrolling="no"></iframe>`;openM();}
  else{window.open(it.url,'_blank');}}
function openM(){$('modal').classList.add('show');}
$('modalClose').onclick=closeM;$('modal').onclick=e=>{if(e.target.id==='modal')closeM();};
function closeM(){$('modal').classList.remove('show');$('modalBody').innerHTML='';}

(async()=>{const d=await loadData();clients=d.clients;cats=d.cats;items=d.items;tileSize=await local.get(K.size,'m');
  buildClientUI();buildCatUI();buildTypeFilter();[...$('sizer').children].forEach(b=>b.classList.toggle('on',b.dataset.size===tileSize));applySize();render();})();
</script>
</body>
</html>
